<style>
  :root {
    --bg: #0e0f11; --bg2: #16181b; --text: #ecebe7; --muted: #8d8f94; --faint: #3a3d42;
    --red: #e5483b; --red-soft: rgba(229, 72, 59, .14); --war: #8a9bb0; --green: #4fb38a; --amber: #e0a43b;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: Inter, "Noto Sans JP", -apple-system, "Hiragino Sans", sans-serif; line-height: 1.8;
    -webkit-font-smoothing: antialiased; }
  html[lang="ja"] body { font-family: "Noto Sans JP", -apple-system, "Hiragino Sans", sans-serif; }
  .num { font-family: Inter, -apple-system, sans-serif; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  section { padding: 96px 16px; }
  .wrap { max-width: 880px; margin: 0 auto; }
  .eyebrow { font-size: 12px; letter-spacing: .2em; color: var(--muted); text-transform: uppercase; margin: 0 0 16px; }
  h2 { font-size: clamp(24px, 4.4vw, 36px); line-height: 1.35; margin: 0 0 20px; font-weight: 900; }
  p.lead { font-size: clamp(15px, 2.2vw, 17px); color: #c9c8c3; max-width: 640px; margin: 0; }
  em { font-style: normal; color: var(--red); font-weight: 700; }
  .reveal { opacity: 0; transform: translateY(24px); transition: opacity .9s ease, transform .9s ease; }
  .reveal.in { opacity: 1; transform: none; }

  /* ---------- Control bar ---------- */
  .bar-top { position: sticky; top: 0; z-index: 10; background: rgba(14,15,17,.86); backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--faint); }
  .bar-top .wrap { display: flex; align-items: center; gap: 10px 16px; padding: 10px 16px; flex-wrap: wrap; max-width: 1080px; }
  .ctl { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .ctl select { font: inherit; font-size: 13px; color: var(--text); background: var(--bg2); border: 1px solid var(--faint);
    border-radius: 8px; padding: 6px 28px 6px 10px; appearance: none; -webkit-appearance: none; cursor: pointer; max-width: 62vw;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: right 13px center, right 8px center; background-size: 5px 5px; background-repeat: no-repeat; }
  .lang { margin-left: auto; display: flex; border: 1px solid var(--faint); border-radius: 8px; overflow: hidden; }
  .lang button { font: inherit; font-size: 12px; background: transparent; color: var(--muted); border: 0; padding: 6px 12px; cursor: pointer; }
  .lang button[aria-pressed="true"] { background: var(--text); color: var(--bg); font-weight: 700; }

  /* ---------- Hero ---------- */
  .hero { min-height: calc(100svh - 104px); display: flex; flex-direction: column; justify-content: center; text-align: center;
    background: radial-gradient(ellipse at 50% 40%, rgba(229,72,59,.10), transparent 60%), var(--bg); position: relative; }
  .hero h1 { font-size: clamp(15px, 2.4vw, 18px); font-weight: 500; color: #c9c8c3; margin: 0 0 12px; }
  .big { font-size: clamp(56px, 15vw, 150px); font-weight: 800; color: var(--red); line-height: 1; margin: 8px 0 12px; }
  .unit { font-size: clamp(16px, 2.6vw, 20px); color: var(--text); font-weight: 700; }
  .since0 { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .hero .since { margin-top: 36px; color: var(--muted); font-size: 14px; }
  .hero .since b { color: var(--text); font-size: 18px; }
  .chip { display: inline-block; margin-top: 14px; font-size: 12px; color: var(--amber); border: 1px solid rgba(224,164,59,.4);
    border-radius: 999px; padding: 2px 12px; }
  .chip[hidden] { display: none; }
  .scroll { position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%); color: var(--muted);
    font-size: 12px; letter-spacing: .15em; text-decoration: none; }
  .scroll::after { content: ""; display: block; width: 1px; height: 36px; background: var(--muted); margin: 10px auto 0;
    animation: drip 2s infinite; transform-origin: top; }
  @keyframes drip { 0% { transform: scaleY(0); } 50% { transform: scaleY(1); } 100% { transform: scaleY(1); opacity: 0; } }

  /* ---------- Pulse ---------- */
  .pulse-box { display: flex; align-items: center; gap: 40px; flex-wrap: wrap; }
  .pulse { width: 140px; height: 140px; position: relative; flex: none; margin: 0 auto; }
  .pulse .core { position: absolute; inset: 50px; border-radius: 50%; background: var(--red); }
  .pulse .ring { position: absolute; inset: 50px; border-radius: 50%; border: 2px solid var(--red); opacity: 0; }
  .pulse.beat .ring { animation: ring 1.2s ease-out; }
  .pulse.beat .core { animation: core .4s ease-out; }
  @keyframes ring { from { inset: 50px; opacity: .9; } to { inset: 0; opacity: 0; } }
  @keyframes core { 50% { transform: scale(1.25); } }
  .pulse-text { flex: 1; min-width: 260px; }
  .stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--faint); margin-top: 40px;
    border: 1px solid var(--faint); border-radius: 12px; overflow: hidden; }
  .stats3 div { background: var(--bg2); padding: 18px 12px; text-align: center; line-height: 1.5; }
  .stats3 .v { font-size: clamp(18px, 4vw, 30px); font-weight: 800; }
  .stats3 .k { font-size: 12px; color: var(--muted); }

  /* ---------- Dot comparison ---------- */
  .dots-sec { background: var(--bg2); }
  .cmp { margin-top: 48px; display: grid; gap: 40px; }
  .cmp-row .label { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  .cmp-row .name { font-weight: 700; font-size: 16px; color: var(--text); }
  .cmp-row .name small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
  .cmp-row .count { font-size: 22px; font-weight: 800; }
  .cmp-row .count small { font-size: 13px; color: var(--muted); font-weight: 500; }
  .grid { display: grid; grid-template-columns: repeat(50, 1fr); gap: 3px; }
  .grid i { aspect-ratio: 1; border-radius: 50%; background: currentColor; opacity: 0; transform: scale(.3);
    transition: opacity .35s, transform .35s; }
  .grid.on i { opacity: 1; transform: none; }
  .grid i.tip { background: var(--amber); }
  .war { color: var(--war); } .clim { color: var(--red); }
  .legend-dot { display: inline-flex; align-items: center; gap: 16px; color: var(--muted); font-size: 13px; margin-top: 8px; flex-wrap: wrap; }
  .legend-dot span { display: inline-flex; align-items: center; gap: 6px; }
  .legend-dot i { width: 9px; height: 9px; border-radius: 50%; background: var(--text); }
  @media (max-width: 520px) { .grid { gap: 2px; } }

  /* ---------- Scale ---------- */
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-top: 40px; }
  .card { background: var(--bg2); border: 1px solid var(--faint); border-radius: 14px; padding: 24px; }
  .card .when { font-size: 13px; color: var(--muted); }
  .card .v { font-size: 28px; font-weight: 800; color: var(--red); margin: 4px 0 12px; line-height: 1.3; }
  .card .eq { font-size: 14.5px; line-height: 1.7; }
  .card .icons { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 5px; }
  .blk { width: 22px; height: 22px; border-radius: 4px; border: 1px solid var(--faint); overflow: hidden; }
  .blk span { display: block; height: 100%; background: var(--red); }
  .card .cap { font-size: 11px; color: var(--muted); margin-top: 6px; }
  .card .cap b { color: var(--red); }

  /* ---------- Scenario ---------- */
  .scn-sec { background: linear-gradient(180deg, var(--bg) 0%, #101613 100%); }
  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 36px; }
  .tab { font: inherit; background: var(--bg2); color: var(--text); border: 1px solid var(--faint); border-radius: 12px;
    padding: 14px 12px; cursor: pointer; text-align: left; transition: border-color .2s, background .2s; line-height: 1.5; }
  .tab b { display: block; font-size: 15px; }
  .tab span { font-size: 12px; color: var(--muted); }
  .tab[aria-pressed="true"] { border-color: var(--green); background: rgba(79,179,138,.08); }
  .tab:first-child[aria-pressed="true"] { border-color: var(--red); background: var(--red-soft); }
  .result { margin-top: 28px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 600px) { .result { grid-template-columns: 1fr; } .tabs { grid-template-columns: 1fr; } }
  .result > div { background: var(--bg2); border: 1px solid var(--faint); border-radius: 14px; padding: 22px; }
  .result .k { font-size: 13px; color: var(--muted); }
  .result .v { font-size: clamp(28px, 6vw, 42px); font-weight: 800; line-height: 1.2; margin-top: 4px; }
  .result .s { font-size: 13px; color: var(--muted); margin-top: 6px; }
  #saved .v { color: var(--green); }
  #lost .v { color: var(--red); }
  .bar { height: 14px; border-radius: 7px; background: var(--faint); margin-top: 28px; overflow: hidden; display: flex; }
  .bar .a { background: var(--red); transition: width .8s cubic-bezier(.2,.8,.2,1); }
  .bar .b { background: var(--green); transition: width .8s cubic-bezier(.2,.8,.2,1); }
  .bar-legend { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 8px; gap: 8px; }

  .cta { display: flex; flex-direction: column; margin-top: 40px; padding: 20px 24px; border-radius: 14px; text-decoration: none; color: var(--text);
    border: 1px solid rgba(79,179,138,.45); background: rgba(79,179,138,.07); transition: background .2s; }
  .cta:hover { background: rgba(79,179,138,.14); }
  .cta span { font-size: 13px; color: var(--muted); }
  .cta b { font-size: 18px; }
  .cta b::after { content: "  →"; color: var(--green); }

  /* ---------- Method ---------- */
  .method { border-top: 1px solid var(--faint); }
  .formula { background: var(--bg2); border: 1px solid var(--faint); border-radius: 12px; padding: 20px; margin: 24px 0;
    font-size: 15px; text-align: center; }
  .formula .num { color: var(--red); font-weight: 700; }
  .method ul { color: #c9c8c3; padding-left: 20px; font-size: 14px; }
  .method li { margin-bottom: 8px; }
  .method a { color: var(--text); }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 32px 16px 48px; }
  footer a { color: var(--muted); }

  @media (prefers-reduced-motion: reduce) {
    .reveal { opacity: 1; transform: none; transition: none; }
    .grid i { transition: none; }
    .pulse.beat .ring, .pulse.beat .core, .scroll::after { animation: none; }
  }
</style>
</head>

    eqDayP: '満員の<b>東京ドーム</b>（約5.5万人）の<br>およそ <b class="num">{p}%</b>',
    capDay: '<b>■</b> ＝ 東京ドーム1杯（5.5万人）',
    eqPopN: '<b>{ref}の全人口</b>（{pop}）の<br>およそ <b class="num">{n}</b> 倍',

/* ===================== STATE ===================== */
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const state = { lang: store.get('scw-lang') === 'ja' ? 'ja' : 'en', country: 'world', tip: 1, r: 0 };
const $ = id => document.getElementById(id);
const L = () => I18N[state.lang];
const t = (k, v = {}) => L()[k].replace(/\{(\w+)\}/g, (_, x) => v[x] ?? '');
const C = () => COUNTRIES[state.country];
const where = () => state.lang === 'ja' ? C().jaIn : C().enIn;
const mult = () => TIPS[state.tip].m;
const perYear = () => C().gt * 1e9 / TPD * mult();
const perSec = () => perYear() / (365.25 * 86400);
const cumulative = (r, years) => { let s = 0; for (let k = 0; k < years; k++) s += C().gt * 1e9 * Math.pow(1 + r, k) / TPD * mult(); return s; };
const refCountry = () => state.country !== 'world' ? C() : COUNTRIES[state.lang === 'ja' ? 'japan' : 'us'];

const fmt = n => Math.round(n).toLocaleString('en-US');
const trim = s => s.replace(/\.0$/, '');
function people(n, withUnit = true) {
  if (state.lang === 'ja') {
    const u = withUnit ? '人' : '';
    if (n >= 1e8) return trim((Math.round(n / 1e7) / 10).toFixed(1)) + '億' + u;
    if (n >= 1e4) return Math.round(n / 1e4).toLocaleString() + '万' + u;
    return fmt(n) + u;
  }
  const u = withUnit ? ' people' : '';
  if (n >= 1e9) return trim((n / 1e9).toFixed(1)) + ' billion' + u;
  if (n >= 1e6) return (n >= 1e7 ? Math.round(n / 1e6) : trim((n / 1e6).toFixed(1))) + ' million' + u;
  return fmt(n) + u;
}
const gtText = gt => state.lang === 'ja'
  ? trim((gt * 10).toFixed(1)) + '億トン'
  :(gt >= 1 ? trim(gt.toFixed(1)) + ' billion t' : Math.round(gt * 1000) + ' million t');
const ratio = x => x >= 10 ? Math.round(x).toString() : trim(x.toFixed(1));
const blocks = x => Array.from({ length: Math.min(40, Math.ceil(x)) }, (_, i) =>
  `<div class="blk"><span style="width:${Math.min(1, x - i) * 100}%"></span></div>`).join('');
function popPhrase(n) {
  const ref = refCountry(), name = state.lang === 'ja' ? ref.ja : ref.enIn, x = n / ref.pop, pop = people(ref.pop, state.lang === 'ja');
  return x >= 1 ? t('eqPopN', { n: ratio(x), ref: name, pop }) : t('eqPopP', { p: Math.max(1, Math.round(x * 100)), ref: name, pop });
}

/* ===================== RENDER ===================== */
let dotsShown = false;
function render() {
  const lang = state.lang;
  document.documentElement.lang = lang;
  document.title = t('title');
  document.querySelectorAll('[data-i18n]').forEach(el => { el.innerHTML = t(el.dataset.i18n); });
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));

  // セレクトの選択肢
  $('country').innerHTML = Object.entries(COUNTRIES).map(([k, c]) => `<option value="${k}">${c[lang]}</option>`).join('');
  $('country').value = state.country;
  $('tip').innerHTML = TIPS.map((x, i) => `<option value="${i}">${x[lang]}</option>`).join('');
  $('tip').value = state.tip;

  // Hero
  $('heroTitle').innerHTML = t('heroTitle', { where: where() });
  $('chip').hidden = mult() === 1;
  $('chip').textContent = t('chip', { tip: TIPS[state.tip][lang] });

  // Pulse
  const iv = 1 / perSec();
  $('pulseH').innerHTML = iv < 120
    ? t('pulseH', { s: iv < 10 ? iv.toFixed(1) : Math.round(iv), unit: t('sec') })
    : t('pulseH', { s: trim((iv / 60).toFixed(1)), unit: t('min') });
  $('perHour').textContent = fmt(perSec() * 3600);
  $('perDay').textContent = fmt(perSec() * 86400);
  $('perYear').textContent = people(perYear(), false);
  startHeart(iv);

  // War comparison
  const yrs = WW2 / perYear();
  $('warLead').innerHTML = t('warLead', { where: where(),
    t: yrs >= 1 ? t('years', { n: yrs >= 10 ? Math.round(yrs) : trim(yrs.toFixed(1)) }) : t('months', { n: Math.max(1, Math.round(yrs * 12)) }) });
  $('tipLegend').hidden = mult() === 1;
  const c35 = cumulative(0, 10), c50 = cumulative(0, 25);
  const rows = [
    { name: t('ww1'), sub: '1914–1918', n: WW1, cls: 'war' },
    { name: t('ww2'), sub: '1939–1945', n: WW2, cls: 'war' },
    { name: t('c35'), sub: t('c35s'), n: c35, cls: 'clim' },
    { name: t('c50'), sub: t('c50s'), n: c50, cls: 'clim' },
  ];
  $('cmp').innerHTML = rows.map(r => {
    const dots = Math.max(r.n >= 5e5 ? 1 : 0, Math.round(r.n / 1e6));
    const base = r.cls === 'clim' ? Math.round(dots / mult()) : dots;   // 線形分（残りはティッピング上乗せ）
    const extra = r.cls === 'clim' ? `<small> ${t('xww2', { x: ratio(r.n / WW2) })}</small>` : '';
    return `<div class="cmp-row ${r.cls}"><div class="label"><div class="name">${r.name}<small>${r.sub}</small></div>
      <div class="count num">${people(r.n)}${extra}</div></div>
      <div class="grid${dotsShown ? ' on' : ''}">${'<i></i>'.repeat(base)}${'<i class="tip"></i>'.repeat(dots - base)}</div></div>`;
  }).join('');

  // Scale cards
  const day = perSec() * 86400, st = day / STADIUM, ref = refCountry();
  $('cDay').textContent = people(day);
  $('eqDay').innerHTML = st >= 1 ? t('eqDayN', { n: ratio(st) }) : t('eqDayP', { p: Math.max(1, Math.round(st * 100)) });
  $('iDay').innerHTML = blocks(st);
  $('capDay').innerHTML = t('capDay');
  $('cYear').textContent = people(perYear());
  $('eqYear').innerHTML = popPhrase(perYear());
  $('iYear').innerHTML = blocks(perYear() / ref.pop);
  $('capYear').innerHTML = t('capPop', { ref: lang === 'ja' ? ref.ja : ref.enIn });
  $('c2050').textContent = people(c50);
  $('eq2050').innerHTML = popPhrase(c50);
  const x50 = c50 / ref.pop;
  $('i2050').innerHTML = blocks(x50 >= 2 ? Math.round(x50) : x50);
  $('cap2050').innerHTML = t('capPop', { ref: lang === 'ja' ? ref.ja : ref.enIn });
  const pc = C().gt * 1e9 / C().pop, life = pc * 80 / TPD * mult();
  $('cLife').textContent = life.toFixed(2) + (lang === 'ja' ? '人' : ' people');
  $('eqLife').innerHTML = t('eqLife', { where: state.country === 'world' ? (lang === 'ja' ? '世界' : 'the world') : where(), pc: trim(pc.toFixed(1)) });

  // Scenario
  $('scnLead').innerHTML = t('scnLead', { where: where() });
  setScenario(state.r);

  // Method
  const m = mult() === 1 ? '' : ` × <span class="num">${mult()}</span>`;
  $('formula').innerHTML = t('formula', { where: where(), gt: gtText(C().gt), mult: m, perYear: people(perYear(), state.lang === 'ja') });
  if (typeof swNav === 'function') { swNav(lang); swNext($('next'), lang); swAuthor($('author'), lang); }
  if (typeof swRenderSources === 'function') swRenderSources($('sources'), lang, ['core', 'emissions', 'pathways', 'tipping', 'war', 'further']);
  $('mList').innerHTML = L().mList.map(s => `<li>${s.replace(/\{(\w+)\}/g, (_, k) => ({ start: START, where: where(), gt: gtText(C().gt) })[k])}</li>`).join('');
}

function setScenario(r) {
  state.r = r;
  const base = cumulative(0, 25), lost = cumulative(r, 25), saved = base - lost;
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.r === r)));
  $('lost').querySelector('.v').textContent = people(lost);
  $('lost').querySelector('.s').textContent = t('lostS', { x: ratio(lost / WW2) });
  $('saved').querySelector('.v').textContent = saved > 0 ? people(saved) : '—';
  $('saved').querySelector('.s').innerHTML = saved > 0 ? popPhrase(saved).replace(/<br>/g, ' ') : t('savedNone');
  $('barA').style.width = (lost / base * 100) + '%';
  $('barB').style.width = (saved / base * 100) + '%';
}

/* ===================== LIVE ===================== */
const t0 = performance.now();
function tick() {
  const now = new Date(), mid = new Date(now); mid.setHours(0, 0, 0, 0);
  $('today').textContent = fmt((now - mid) / 1000 * perSec());
  $('since').textContent = fmt((performance.now() - t0) / 1000 * perSec());
  requestAnimationFrame(tick);
}
let heartTimer;
function startHeart(iv) {
  clearInterval(heartTimer);
  const heart = $('heart');
  heartTimer = setInterval(() => { heart.classList.remove('beat'); void heart.offsetWidth; heart.classList.add('beat'); }, Math.max(600, iv * 1000));
}

/* ===================== EVENTS ===================== */
document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => {
  state.lang = b.dataset.lang; store.set('scw-lang', state.lang); render();
}));
$('country').addEventListener('change', e => { state.country = e.target.value; render(); });
$('tip').addEventListener('change', e => { state.tip = +e.target.value; render(); });
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => setScenario(+b.dataset.r)));

render();
tick();

/* --- Scroll reveal --- */
const io = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return;
  e.target.classList.add('in');
  io.unobserve(e.target);
}), { threshold: 0.15 });
document.querySelectorAll('.reveal').forEach(el => io.observe(el));
// 点グリッドは最初に見えた時だけ順に点灯させる
const dotIo = new IntersectionObserver(es => {
  if (!es.some(e => e.isIntersecting) || dotsShown) return;
  dotsShown = true; dotIo.disconnect();
  const grids = [...document.querySelectorAll('#cmp .grid')];
  grids.forEach(g => {
    const ds = g.children, step = Math.max(1, Math.floor(ds.length / 60));
    let i = 0; (function lit() {
      for (let k = 0; k < step && i < ds.length; k++, i++) { ds[i].style.opacity = 1; ds[i].style.transform = 'none'; }
      if (i < ds.length) requestAnimationFrame(lit); else g.classList.add('on');
    })();
  });
}, { threshold: 0.1 });
dotIo.observe($('cmp'));
</script>
