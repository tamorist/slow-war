<script>
const I18N = {

    lead: 'The simulators are a doorway, not the final word. Every figure on this site traces back to published data or to an assumption we state openly. Follow the links to go deeper.',

    cols: ['Number', 'Value used', 'Source'],

      ['Deaths per tonne of CO₂', '1 future death per 1,000 t (the “1,000-ton rule”)', 'Pearce & Parncutt (2023)', 'data'],

      ['Food impacts', 'Emissions by stage, land, water, pollution', 'Poore & Nemecek (2018) via Our World in Data', 'data'],
      ['Methane warming', '×2.9 when switching from a 100- to a 20-year view', 'IPCC AR6 WGI Ch. 7', 'data'],

    allH: 'All sources',
    footer: '<a href="index.html">The Slow War</a> · Model-based approximations. Found an error or a better source? Please let us know.',
  },
  ja: {
    title: '出典とデータ — 静かな戦争',

    h1: '数字はどこから来ているか',
    lead: 'シミュレータは入り口であって、結論ではありません。このサイトのすべての数値は、公表されたデータか、私たちがはっきり示した前提にさかのぼれます。リンクをたどって、さらに深く調べてみてください。',

    ],
    tagData: '公表データ', tagEst: '私たちの概算',
    pathH: '年 −7% を「2℃目標の道」と呼ぶ理由',
    pathNote: 'UNEP は、1.5℃には2035年まで年約7.5%、2℃には年約4%の削減が必要と推計しています。ただし1.5℃の数字は、将来の大規模なCO₂除去や、一時的に1.5℃を超えること（オーバーシュート）を前提にしています。残りのカーボンバジェットで判断すると、2025年から毎年7%ずつ減らしても合計で約570 Gt CO₂（40 ÷ 0.07）を排出します。これは1.5℃のために残された約130 Gtの4倍以上ですが、2℃未満にとどめるバジェットには収まります。対策がすでにこれだけ遅れていることを踏まえ、「2℃」と呼ぶほうが誠実だと考えています。',
    allH: 'すべての出典',
    footer: '<a href="index.html">静かな戦争</a> ・ 推計モデルによる概算です。誤りやより良い出典があれば、ぜひお知らせください。',
  },
};
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
let lang = store.get('scw-lang') === 'ja' ? 'ja' : 'en';
function render() {
  const l = I18N[lang];
  document.documentElement.lang = lang;
  document.title = l.title;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.innerHTML = l[el.dataset.i18n]; });
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  document.getElementById('keyTable').innerHTML = `<tr>${l.cols.map(c => `<th>${c}</th>`).join('')}</tr>` +
    l.rows.map(([a, b, c, t]) => `<tr><td>${a}<br><span class="tag ${t === 'est' ? 'est' : ''}">${t === 'est' ? l.tagEst : l.tagData}</span></td><td>${b}</td><td>${c}</td></tr>`).join('');
  swRenderSources(document.getElementById('sources'), lang);
}
document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => {
  lang = b.dataset.lang; store.set('scw-lang', lang); render();
}));
render();
</script>
