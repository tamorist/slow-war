const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const S = { lang: store.get('scw-lang') === 'ja' ? 'ja' : 'en', tip: 1, basis: 'protein', sel: 'chicken', diet: 'vegan', rel: 25, sinkCut: 50 };
const $ = id => document.getElementById(id);
const L = () => I18N[S.lang];
const tpl = (s, v = {}) => s.replace(/\{(\w+)\}/g, (_, x) => v[x] ?? '');
const mult = () => TIPS[S.tip].m;
const fmt = n => Math.round(n).toLocaleString('en-US');
const trim = s => s.replace(/\.0$/, '');
const sig = (n, d = 2) => { if (n <= 0) return 0; const p = Math.pow(10, Math.floor(Math.log10(n)) - d + 1); return Math.round(n / p) * p; };
function people(n) {
  if (S.lang === 'ja') {
    if (n >= 1e8) return trim((Math.round(n / 1e7) / 10).toFixed(1)) + '億人';
    if (n >= 1e5) return Math.round(n / 1e4).toLocaleString() + '万人';
    if (n >= 1e4) return trim((n / 1e4).toFixed(1)) + '万人';
    return fmt(sig(n)) + '人';
  }
  if (n >= 1e9) return trim((n / 1e9).toFixed(1)) + ' billion';
  if (n >= 1e6) return (n >= 1e7 ? Math.round(n / 1e6) : trim((n / 1e6).toFixed(1))) + ' million';
  return fmt(sig(n)) + (n === 1 ? ' life' : ' lives');
}
const chip = (group, val, label, on, extra = '') => `<button class="chip" data-g="${group}" data-v="${val}" aria-pressed="${on}">${label}${extra}</button>`;

function renderCompare() {
  const l = L(), b = S.basis;
  const sel = S.sel, sname = l.food[sel];
  $('selChips').innerHTML = Object.keys(FOODS).filter(f => !PLANTS.includes(f)).map(f => chip('sel', f, l.food[f], sel === f)).join('');
  $('basisChips').innerHTML = ['protein', 'kg'].map(v => chip('basis', v, l.basis[v], b === v)).join('');
  // 基準：たんぱく質100 gあたり ＝ 1 kgあたり ÷ (たんぱく質割合 × 10)
  const val = (f, ind) => { const x = FOODS[f][ind]; return b === 'protein' ? x / (FOODS[f].protein * 10) : x; };
  const num = v => v >= 100 ? fmt(v) : v >= 10 ? v.toFixed(1) : v.toFixed(2);
  const rx = x => x >= 10 ? fmt(x) : trim(x.toFixed(1));

  // 選んだ食材と植物性の倍率
  const cards = INDICATORS.map(ind => {
    const c = val(sel, ind), r = PLANTS.map(p => c / val(p, ind)), lo = Math.min(...r), hi = Math.max(...r);
    const x = Math.abs(hi - lo) < 0.25 ? tpl(l.times, { x: rx(lo) }) : tpl(l.times, { x: rx(lo) + '–' + rx(hi) });
    return `<div><div class="k">${tpl(l.vsK, { ind: l.ind[ind], food: sname })}</div><div class="v num">${x}</div>
      <div class="s">${tpl(l.vsS, { food: sname, c: num(c), t: num(val('tofu', ind)), p: num(val('peas', ind)) })} ${l.unit[ind]}</div></div>`;
  });
  const per100kgProtein = f => FOODS[f].animals / FOODS[f].protein * 100;
  if (FOODS[sel].animals) {
    const n = per100kgProtein(sel), ratio = n / per100kgProtein('beef');
    cards.push(`<div class="animal"><div class="k">${tpl(l.animalK, { food: sname })}</div><div class="v num">${tpl(l.animalV, { n: n >= 10 ? fmt(n) : trim(n.toFixed(1)), u: l.animalU[sel] })}</div>
      <div class="s">${sel === 'beef' ? l.animalSB : tpl(l.animalS, { x: fmt(ratio) })}</div></div>`);
  }
  $('vsCards').innerHTML = cards.join('');

  // 指標ごとの棒グラフ（桁違いの値は棒を省略して、鶏肉と植物性の差が見えるようにする）
  const panel = (title, unit, rows) => {
    const vs = rows.map(r => r.v).sort((a, b) => b - a);
    let cap = (vs[2] ?? vs[0]) * 1.15;
    if (vs[0] <= cap * 1.3) cap = vs[0] * 1.02;
    const anyBroken = rows.some(r => r.v > cap);
    return `<div class="fpanel"><h4>${title}</h4><div class="u">${unit}</div>${rows.map(r => {
      const cls = r.f === sel ? 'hl-sel' : PLANTS.includes(r.f) ? 'hl-plant' : '';
      const col = r.f === sel ? 'var(--amber)' : PLANTS.includes(r.f) ? 'var(--green)' : '#6b7078';
      return `<div class="frow ${cls}"><span class="fn">${l.food[r.f]}</span>
        <div class="fb${r.v > cap ? ' broken' : ''}"><span style="width:${Math.min(1, r.v / cap) * 100}%;background:${col}"></span></div>
        <span class="fv">${num(r.v)}</span></div>`;
    }).join('')}${anyBroken ? `<div class="brk">${l.brk}</div>` : ''}</div>`;
  };
  const foods = Object.keys(FOODS);
  const panels = INDICATORS.map(ind => panel(l.ind[ind], l.unit[ind] + ' / ' + l.basis[b].replace(/（.*|\s*\(.*/, ''), foods.map(f => ({ f, v: val(f, ind) }))));
  const meats = foods.filter(f => FOODS[f].animals);
  panels.push(panel(l.ind.animals, l.unitAnimals[b], meats.map(f => ({ f, v: b === 'protein' ? per100kgProtein(f) : FOODS[f].animals * 1000 }))));
  $('fpanels').innerHTML = panels.join('');
}

  const w = PLANET.wf, seg = (v, c, t) => `<span style="width:${v}%;background:${c}">${t}</span>`;
  $('wfBar').innerHTML = seg(w.old, '#6e4a36', '') + seg(w.recent, '#b0603c', ja ? '−1/6' : '−1/6') + seg(w.left, '#3f9a77', l.wf.left + ' ≈ 2/3');
  $('wfLegend').innerHTML = [['#6e4a36', l.wf.old], ['#b0603c', l.wf.recent], ['#3f9a77', l.wf.left]].map(([c, t]) => `<span><i style="background:${c}"></i>${t}</span>`).join('');
  const facts = arr => arr.map(([v, t, src]) => `<div><div class="v num">${v}</div><div class="s">${t}</div><span class="src">${src}</span></div>`).join('');
  $('wfFacts').innerHTML = facts(l.wfFacts);
  const dv = PLANET.drivers, dTot = Object.values(dv).reduce((a, b) => a + b, 0);
  const dCol = { cattle: '#8a5a3c', oil: '#d08b2c', wood: '#7a6f5a', cereal: '#b5a14a', other: '#6b7078' };
  $('drBar').innerHTML = Object.keys(dv).map(k => { const p = dv[k] / dTot * 100; return seg(p, dCol[k], p > 9 ? Math.round(p) + '%' : ''); }).join('');
  $('drLegend').innerHTML = Object.keys(dv).map(k => `<span><i style="background:${dCol[k]}"></i>${l.dr[k]} ${Math.round(dv[k] / dTot * 100)}%</span>`).join('');
  $('palmList').innerHTML = l.palm.map(x => `<li>${x}</li>`).join('');
  const k = PLANET.sink, air = 100 - k.ocean - k.land;
  $('skBar').innerHTML = seg(k.ocean, '#3f7fb5', l.sk.ocean) + seg(k.land, '#3f9a77', l.sk.land) + seg(air, '#8a4b3c', l.sk.air);
  $('skLegend').innerHTML = [['#3f7fb5', l.sk.ocean], ['#3f9a77', l.sk.land], ['#8a4b3c', l.sk.air]].map(([c, t]) => `<span><i style="background:${c}"></i>${t}</span>`).join('');
  $('skFacts').innerHTML = facts(l.skFacts);
  $('sinkChips').innerHTML = [10, 25, 50, 100].map(x => chip('sink', x, '−' + x + '%', S.sinkCut === x)).join('');
  // 陸の吸収（CO₂ t/年）× 減る割合 → 大気に残るCO₂ → 1,000トン・ルール（CO₂ 3,664 tで1人、係数なし）
  const extra = PLANET.emisGt * 1e9 * k.land / 100 * S.sinkCut / 100, n = extra / 3664, base = PLANET.emisGt * 1e9 / 3664;
  const gt = ja ? trim((extra / 1e8).toFixed(0)) : trim((extra / 1e9).toFixed(1));
  $('sinkOut').innerHTML = tpl(l.sinkOut, { gt, n: people(sig(n)), p: Math.round(n / base * 100) + '%', src: S.sinkCut === 100 ? l.sinkSrc : '' });
}

function renderPlanet() {
  const l = L(), ja = S.lang === 'ja';
  const col = { ghg: 'var(--red)', land: 'var(--s-farm, #b08a5a)', water: '#4a90c2', eutro: '#5bb5a2' };
  $('shareBars').innerHTML = Object.entries(PLANET.share).map(([k, v]) => `<div class="share-row"><span>${l.share[k][0]}</span>
    <div class="sb"><span style="width:${v}%;background:${col[k]}"></span></div><span class="sv num">${v}%</span><span class="ss">${l.share[k][1]}</span></div>`).join('');
  $('liveBars').innerHTML = Object.entries(PLANET.live).map(([k, v]) => `<div class="share-row"><span>${l.live[k]}</span>
    <div class="sb"><span style="width:${v}%;background:${k === 'land' ? '#8a6d4a' : 'var(--amber)'}"></span></div><span class="sv num">${k === 'land' ? l.liveLand : v + '%'}</span></div>`).join('');
  const deaths = PLANET.foodGt * 1e9 / 3664 * mult();
  $('foodDeath').innerHTML = tpl(l.pfDeath, { n: people(sig(deaths)), tip: TIPS[S.tip][S.lang] });

  // B：アマゾンの森（もとの広さ＝100%）。失われた割合と危険域
  const a = PLANET.amz;
  $('forest').innerHTML = `<div class="fhead"><span>${l.fAll}</span><span class="left">${l.fLeft}</span></div>
    <div class="bar"><div class="lost" style="width:${a.lost}%"></div><div class="zone" style="left:${a.lo}%;width:${a.hi - a.lo}%"></div></div>
    <div class="labs"><span class="l1" style="left:${a.lost}%">${l.fLost}</span><span class="l2" style="left:${a.hi}%">${l.fZone}</span></div>
    <div class="key"><span><i style="background:#a65a38"></i>${l.kLost}</span><span><i style="background:#3f9a77"></i>${l.kLeft}</span><span><i style="background:rgba(229,72,59,.5);outline:1px dashed #ff7a6b"></i>${l.kZone}</span></div>`;
  $('impCards').innerHTML = l.imp.map(([ic, v, t]) => `<div><div class="ic">${ic}</div><div class="v num">${v}</div><div class="s">${t}</div></div>`).join('');
  $('relChips').innerHTML = [10, 25, 50, 100].map(x => chip('rel', x, x + '%', S.rel === x)).join('');
  const rl = a.carbonLo * S.rel / 100 / 1000, rh = a.carbonHi * S.rel / 100 / 1000;
  $('impDeath').innerHTML = tpl(l.impDeath, { lo: people(rl).replace(/人$|\s(million|billion)$/, ''), hi: people(rh), ww2: l.impWW2 });
  $('amzStats').innerHTML = l.amz.map(([v, s]) => `<div><div class="v num" style="font-size:28px">${v}</div><div class="s">${s}</div></div>`).join('');

  // C：世界の食べ方が変わったら
  const keys = Object.keys(PLANET.diets), sel = S.diet, now = dietTotal('now'), max = now;
  $('dietChips').innerHTML = keys.map(k => chip('diet', k, l.diet[k], sel === k)).join('');
  const tot = dietTotal(sel), freed = now - tot;
  const bn = n => ja ? trim((n * 10).toFixed(1)) : n.toFixed(2);
  const habOf = v => v / now * PLANET.habFarm, pct = v => Math.round(v) + '%';
  const hFarm = habOf(tot), hFree = habOf(freed);
  $('dietStats').innerHTML = `
    <div><div class="k">${l.dTotK}</div><div class="v num">${pct(hFarm)}</div><div class="s">${tpl(l.dTotS, { p: pct(hFarm), b: tpl(l.bha, { n: bn(tot) }) })}</div></div>
    <div><div class="k">${l.dFreeK}</div><div class="v num" style="color:var(--green)">${freed > 0 ? pct(hFree) : '—'}</div><div class="s">${freed > 0 ? tpl(l.dFreeS, { p: pct(hFree), b: tpl(l.bha, { n: bn(freed) }) }) + '<br>' + tpl(l.dForS, { p: Math.round(freed / PLANET.forestBha * 10) * 10 + '%' }) + '<br>' + tpl(l.dJpS, { n: fmt(freed / PLANET.japanBha), x: sel === 'vegan' ? l.dNA : '' }) : l.dNone}</div></div>`;
  $('hab').innerHTML = `<div class="ph3" style="margin:18px 0 8px;font-size:13px;color:#c9c8c3;font-weight:500">${l.hab}</div>
    <div class="hbar"><span style="width:${hFarm}%;background:#a0786a">${l.hFarm} ${pct(hFarm)}</span>${freed > 0 ? `<span class="free" style="width:${hFree}%">${hFree > 8 ? l.hFree + ' ' + pct(hFree) : ''}</span>` : ''}<span style="flex:1;color:#c9c8c3">${l.hRest}</span></div>
    <div class="slegend"><span><i style="background:#a0786a"></i>${l.hFarm}</span><span><i style="background:#4fb38a"></i>${l.hFree}</span><span><i style="background:#3a3f45"></i>${l.hRest}</span></div>
    <div class="cap">${l.hCap}</div>`;
  const seg = (v, c, label) => v > 0 ? `<span style="width:${v / max * 100}%;background:${c}" title="${label}">${v / max > 0.12 ? tpl(l.bha, { n: bn(v) }) : ''}</span>` : '';
  $('dietBars').innerHTML = keys.map(k => {
    const x = PLANET.diets[k];
    const bars = x.crop != null ? seg(x.crop, 'repeating-linear-gradient(135deg, #a0786a 0 6px, #7a5146 6px 12px)', l.lgCropAll) : seg(x.cropFood, '#a0786a', l.lgCrop) + seg(x.cropFeed, '#7a5146', l.lgFeed);
    return `<div class="diet-row${k === sel ? ' on' : ''}" data-g="diet" data-v="${k}" role="button" tabindex="0"><span class="dn">${l.diet[k]}${l.dietSub[k] ? `<br><span class="hint" style="font-size:11px">${l.dietSub[k]}</span>` : ''}</span>
      <div class="db">${bars}${seg(x.past, '#5a7d5c', l.lgPast)}</div><span class="dt">${tpl(l.bha, { n: bn(dietTotal(k)) })}</span></div>`;
  }).join('');
  $('dietLegend').innerHTML = [['#a0786a', l.lgCrop], ['#7a5146', l.lgFeed], ['repeating-linear-gradient(135deg, #a0786a 0 3px, #7a5146 3px 6px)', l.lgCropAll], ['#5a7d5c', l.lgPast]]
    .map(([c, t]) => `<span><i style="background:${c}"></i>${t}</span>`).join('');
}

function render() {
  const l = L();
  document.documentElement.lang = S.lang;
  document.title = l.title;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.innerHTML = l[el.dataset.i18n]; });
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === S.lang)));
  $('tip').innerHTML = TIPS.map((x, i) => `<option value="${i}">${x[S.lang]}</option>`).join('');
  $('tip').value = S.tip;
  $('pbGrid').innerHTML = l.pb.map(([name, over, d, food]) => `<div class="${over ? 'over' : 'safe'}">${food ? '<span class="food" title="food">🍽</span>' : ''}<span class="st">${over ? l.pbOver : l.pbSafe}</span><b>${name}</b>${d ? `<div class="d">${d}</div>` : ''}</div>`).join('');
  $('popRows').innerHTML = l.pop.map(([k, a, b, unit]) => `<div class="prow"><div class="pk"><span>${k}</span><b>${tpl(l.popTimes, { x: (b / a).toFixed(1) })}</b></div>
    <div class="pb"><span>1975</span><div style="width:${a / b * 100}%;background:#5a5f66">${tpl(unit, { n: a })}</div></div>
    <div class="pb"><span>2023</span><div style="width:100%;background:${'#c0623d'}">${tpl(unit, { n: b })}</div></div></div>`).join('');
  $('why').innerHTML = l.why.map(([c, h, p, src]) => `<div style="--c:${c}"><b>${h}</b><p>${p}</p><span class="src">${src}</span></div>`).join('');
  if (typeof swNav === 'function') { swNav(S.lang); swNext($('next'), S.lang); swAuthor($('author'), S.lang); }
  if (typeof swRenderSources === 'function') swRenderSources($('sources'), S.lang, ['nature', 'food', 'land'], 6);
  renderPlanet();
  renderForests();
  renderCompare();
  renderAct();
}

/* ===================== EVENTS ===================== */
document.addEventListener('click', e => {
  const t = e.target.closest('button, .diet-row');
  if (!t) return;
  if (t.dataset.lang) { S.lang = t.dataset.lang; store.set('scw-lang', S.lang); render(); return; }
  const g = t.dataset.g, v = t.dataset.v;
  if (g === 'basis') { S.basis = v; renderCompare(); }
  else if (g === 'sel') { S.sel = v; renderCompare(); }
  else if (g === 'diet') { S.diet = v; renderPlanet(); }
  else if (g === 'rel') { S.rel = +v; renderPlanet(); }
  else if (g === 'sink') { S.sinkCut = +v; renderForests(); }
});
$('tip').addEventListener('change', e => { S.tip = +e.target.value; renderPlanet(); });
render();
</script>
</body>
</html>
