<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Day, at Scale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0f11; --bg2: #16181b; --bg3: #1d2024; --text: #ecebe7; --muted: #8d8f94; --faint: #34373c;
    --red: #e5483b; --green: #4fb38a; --amber: #e0a43b;
    --s-luc: #b0703f; --s-farm: #e0a43b; --s-feed: #86b35c; --s-post: #6b7078; --s-coc: #2f7d62;
    --c-transport: #e5483b; --c-food: #e0a43b; --c-home: #5b9bd5; --c-flights: #a983e0; --c-shopping: #4fb38a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); line-height: 1.7;
    font-family: Inter, "Noto Sans JP", -apple-system, "Hiragino Sans", sans-serif; -webkit-font-smoothing: antialiased; }
  html[lang="ja"] body { font-family: "Noto Sans JP", -apple-system, "Hiragino Sans", sans-serif; }
  .num { font-family: Inter, -apple-system, sans-serif; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }
  a { color: var(--text); }
  [hidden] { display: none !important; }

  /* Control bar */
  .bar-top { position: sticky; top: 0; z-index: 20; background: rgba(14,15,17,.88); backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--faint); }
  .bar-top .wrap { display: flex; align-items: center; gap: 10px 16px; padding-top: 10px; padding-bottom: 10px; flex-wrap: wrap; }
  .ctl { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  select { font: inherit; font-size: 13px; color: var(--text); background: var(--bg2); border: 1px solid var(--faint);
    border-radius: 8px; padding: 6px 28px 6px 10px; appearance: none; -webkit-appearance: none; cursor: pointer; max-width: 62vw;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: right 13px center, right 8px center; background-size: 5px 5px; background-repeat: no-repeat; }
  .lang { margin-left: auto; display: flex; border: 1px solid var(--faint); border-radius: 8px; overflow: hidden; }
  .lang button { font: inherit; font-size: 12px; background: transparent; color: var(--muted); border: 0; padding: 6px 12px; cursor: pointer; }
  .lang button[aria-pressed="true"] { background: var(--text); color: var(--bg); font-weight: 700; }

  /* Hero */
  .hero { padding: 72px 0 48px; }
  .eyebrow { font-size: 12px; letter-spacing: .2em; color: var(--muted); text-transform: uppercase; margin: 0 0 14px; }
  h1 { font-size: clamp(30px, 6vw, 52px); line-height: 1.2; margin: 0 0 18px; font-weight: 900; }
  .lead { font-size: clamp(15px, 2.2vw, 17px); color: #c9c8c3; max-width: 660px; margin: 0; }
  h2 { font-size: clamp(22px, 3.6vw, 30px); line-height: 1.35; margin: 0 0 12px; font-weight: 900; }

  /* Layout */
  .layout { display: grid; gap: 24px; grid-template-columns: 1fr; padding-bottom: 32px; }
  @media (min-width: 900px) { .layout { grid-template-columns: 1fr 380px; align-items: start; } .result { position: sticky; top: 72px; } }

  /* Input blocks */
  .block { background: var(--bg2); border: 1px solid var(--faint); border-radius: 14px; padding: 20px; margin-bottom: 16px; }
  .block h3 { margin: 0 0 4px; font-size: 16px; display: flex; align-items: center; gap: 10px; }
  .block h3 .dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .block h3 .kg { margin-left: auto; font-size: 13px; color: var(--muted); font-weight: 500; }
  .hint { font-size: 12px; color: var(--muted); margin: 0 0 12px; }
  .sub-label { font-size: 13px; color: #c9c8c3; margin: 14px 0 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font: inherit; font-size: 13px; color: var(--text); background: var(--bg3); border: 1px solid var(--faint); border-radius: 999px;
    padding: 6px 12px; cursor: pointer; transition: border-color .15s, background .15s; line-height: 1.4; }
  .chip:hover { border-color: #55595f; }
  .chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); font-weight: 700; }
  .chip small { opacity: .65; font-weight: 400; margin-left: 4px; }
  .meal-row { display: grid; grid-template-columns: 64px 1fr; gap: 8px; align-items: center; margin-top: 10px; }
  .meal-row > span { font-size: 13px; color: #c9c8c3; }
  .row { display: flex; align-items: center; gap: 12px; }
  input[type=range] { flex: 1; accent-color: var(--text); }
  .val { min-width: 64px; text-align: right; font-weight: 700; }
  .toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; margin-top: 12px; cursor: pointer; color: #c9c8c3; }
  .toggle input { accent-color: var(--green); width: 16px; height: 16px; }
  .stepper { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--faint); }
  .stepper:first-of-type { border-top: 0; }
  .stepper .lbl { font-size: 13.5px; }
  .stepper .lbl small { display: block; color: var(--muted); font-size: 11.5px; }
  .step { display: flex; align-items: center; gap: 4px; flex: none; }
  .step button { font: inherit; width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--faint); background: var(--bg3);
    color: var(--text); cursor: pointer; font-size: 16px; line-height: 1; }
  .step b { min-width: 28px; text-align: center; }
  .shop { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .item { position: relative; text-align: left; font: inherit; color: var(--text); background: var(--bg3); border: 1px solid var(--faint);
    border-radius: 12px; padding: 10px 12px; cursor: pointer; line-height: 1.4; }
  .item.on { border-color: var(--c-shopping); background: rgba(79,179,138,.08); }
  .item b { display: block; font-size: 13.5px; padding-right: 26px; }
  .item .k { font-size: 12px; color: var(--muted); }
  .item .eq { font-size: 11px; color: var(--muted); opacity: .8; }
  .item .cnt { position: absolute; top: 8px; right: 8px; min-width: 22px; height: 22px; border-radius: 11px; background: var(--c-shopping);
    color: #0b1a13; font-size: 12px; font-weight: 800; display: grid; place-items: center; padding: 0 6px; }
  .item .minus { position: absolute; bottom: 8px; right: 8px; width: 22px; height: 22px; border-radius: 6px; border: 1px solid var(--faint);
    background: var(--bg2); color: var(--text); font-size: 14px; line-height: 1; cursor: pointer; }

  /* Result panel */
  .result { background: var(--bg2); border: 1px solid var(--faint); border-radius: 16px; padding: 22px; }
  .result .k { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .total { font-size: 56px; font-weight: 900; line-height: 1.05; margin: 6px 0 2px; }
  .total small { font-size: 18px; font-weight: 600; color: var(--muted); margin-left: 6px; }
  .vs { font-size: 12.5px; color: var(--muted); }
  .stack { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--faint); margin: 16px 0 8px; }
  .stack span { transition: width .4s ease; }
  .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 12px; font-size: 12px; color: #c9c8c3; }
  .legend div { display: flex; align-items: center; gap: 6px; }
  .legend i { width: 9px; height: 9px; border-radius: 2px; flex: none; }
  .legend .n { margin-left: auto; color: var(--muted); }
  .scale-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--bg); padding: 4px; border-radius: 10px; margin: 22px 0 16px; }
  .scale-tabs button { font: inherit; font-size: 12px; background: transparent; color: var(--muted); border: 0; border-radius: 7px; padding: 8px 4px; cursor: pointer; line-height: 1.3; }
  .scale-tabs button[aria-pressed="true"] { background: var(--bg3); color: var(--text); font-weight: 700; box-shadow: 0 0 0 1px var(--faint); }
  .impact .big { font-size: 40px; font-weight: 900; color: var(--red); line-height: 1.1; }
  .impact .cap { font-size: 13px; color: #c9c8c3; margin-top: 6px; }
  .impact .sub { font-size: 12.5px; color: var(--muted); margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--faint); }

  /* Plate */
  .plate { padding: 56px 0 24px; border-top: 1px solid var(--faint); }
  .gwp-row { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; margin-top: 24px; font-size: 13px; color: #c9c8c3; }
  .plate .hint { margin-top: 8px; max-width: 680px; }
  .pstats { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; margin: 24px 0 8px; }
  .pstats > div { background: var(--bg2); border: 1px solid var(--faint); border-radius: 14px; padding: 18px; }
  .pstats .k { font-size: 12.5px; color: #c9c8c3; }
  .pstats .v { font-size: 32px; font-weight: 900; line-height: 1.2; margin-top: 4px; }
  .pstats .s { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .ph3 { font-size: 15px; margin: 32px 0 12px; }
  .mrow { display: grid; grid-template-columns: 130px 1fr 64px; gap: 10px; align-items: center; padding: 6px 8px; border-radius: 8px; }
  .mrow.today { background: var(--bg2); box-shadow: inset 0 0 0 1px var(--faint); }
  .mrow .mn { font-size: 13px; line-height: 1.3; }
  .mrow .badge { display: inline-block; margin-left: 6px; font-size: 10.5px; color: var(--bg); background: var(--text); border-radius: 999px; padding: 0 6px; font-weight: 700; }
  .mrow .mb { display: flex; height: 16px; border-radius: 4px; overflow: hidden; background: var(--bg3); }
  .mrow .mb span { transition: width .5s ease; }
  .mrow .mv { text-align: right; font-size: 13px; font-weight: 700; }
  @media (max-width: 520px) { .mrow { grid-template-columns: 92px 1fr 54px; gap: 6px; } }
  .slegend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: #c9c8c3; margin-top: 10px; }
  .slegend span { display: inline-flex; align-items: center; gap: 6px; }
  .slegend i { width: 10px; height: 10px; border-radius: 2px; }
  .tbl-wrap { overflow-x: auto; }
  table.swapt { max-width: none; font-size: 13px; }
  .swapt th { text-align: right; font-weight: 500; color: var(--muted); font-size: 11.5px; padding: 4px 8px; border-bottom: 1px solid var(--faint); }
  .swapt td { text-align: right; color: var(--text); }
  .swapt td:first-child, .swapt th:first-child { text-align: left; }
  .swapt td.g { color: var(--green); font-weight: 700; }
  .mrow .mb span.coc { background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.18) 0 3px, transparent 3px 7px); }
  .note-box { font-size: 13px; color: #c9c8c3; background: var(--bg2); border-left: 3px solid var(--s-farm); border-radius: 0 10px 10px 0; padding: 14px 16px; margin-top: 20px; max-width: 760px; }

  /* Compare foods */
  .cmpfood { padding: 56px 0 24px; border-top: 1px solid var(--faint); }
  .vs-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-top: 24px; }
  .vs-cards > div { background: var(--bg2); border: 1px solid var(--faint); border-radius: 14px; padding: 16px; }
  .vs-cards .k { font-size: 12.5px; color: #c9c8c3; }
  .vs-cards .v { font-size: 30px; font-weight: 900; color: var(--amber); line-height: 1.2; margin-top: 2px; }
  .vs-cards .s { font-size: 11.5px; color: var(--muted); margin-top: 4px; line-height: 1.5; }
  .vs-cards .animal { border-color: rgba(229,72,59,.45); background: rgba(229,72,59,.06); }
  .vs-cards .animal .v { color: var(--red); }
  .fpanels { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; margin-top: 20px; }
  .fpanel { background: var(--bg2); border: 1px solid var(--faint); border-radius: 14px; padding: 16px; }
  .fpanel h4 { margin: 0; font-size: 14px; }
  .fpanel .u { font-size: 11.5px; color: var(--muted); margin-bottom: 10px; }
  .frow { display: grid; grid-template-columns: 78px 1fr 64px; gap: 8px; align-items: center; margin: 5px 0; font-size: 12.5px; }
  .frow .fb { height: 12px; background: var(--bg3); border-radius: 3px; position: relative; overflow: hidden; }
  .frow .fb span { position: absolute; inset: 0 auto 0 0; border-radius: 3px; transition: width .4s ease; }
  .frow .fb.broken span { -webkit-mask: linear-gradient(90deg, #000 calc(100% - 14px), transparent calc(100% - 14px), transparent calc(100% - 9px), #000 calc(100% - 9px));
    mask: linear-gradient(90deg, #000 calc(100% - 14px), transparent calc(100% - 14px), transparent calc(100% - 9px), #000 calc(100% - 9px)); }
  .frow .fv { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .frow.hl-plant .fn { color: var(--green); font-weight: 700; }
  .frow.hl-sel .fn { color: var(--amber); font-weight: 700; }
  .fpanel .brk { font-size: 10.5px; color: var(--muted); margin-top: 6px; }

  /* What-if */
  .whatif { padding: 56px 0 24px; border-top: 1px solid var(--faint); }
  .swaps { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; margin-top: 24px; }
  .swap { display: flex; gap: 12px; align-items: flex-start; text-align: left; font: inherit; color: var(--text); background: var(--bg2);
    border: 1px solid var(--faint); border-radius: 14px; padding: 14px 16px; cursor: pointer; line-height: 1.45; }
  .swap .box { width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid #55595f; flex: none; margin-top: 2px; display: grid; place-items: center; }
  .swap[aria-pressed="true"] { border-color: var(--green); background: rgba(79,179,138,.07); }
  .swap[aria-pressed="true"] .box { background: var(--green); border-color: var(--green); }
  .swap[aria-pressed="true"] .box::after { content: ""; width: 5px; height: 10px; border: solid #0b1a13; border-width: 0 2px 2px 0; transform: rotate(45deg) translate(-1px, -1px); }
  .swap b { display: block; font-size: 14px; }
  .swap .d { font-size: 12px; color: var(--muted); }
  .swap .d .g { color: var(--green); font-weight: 700; }
  .empty { color: var(--muted); font-size: 14px; margin-top: 16px; }
  .saved { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-top: 20px; }
  .saved > div { background: linear-gradient(180deg, rgba(79,179,138,.10), rgba(79,179,138,.03)); border: 1px solid rgba(79,179,138,.35);
    border-radius: 14px; padding: 18px; }
  .saved .k { font-size: 12.5px; color: #c9c8c3; }
  .saved .v { font-size: 34px; font-weight: 900; color: var(--green); line-height: 1.2; margin-top: 4px; }
  .saved .s { font-size: 12px; color: var(--muted); margin-top: 4px; }

  /* About */
  .about { padding: 48px 0 24px; border-top: 1px solid var(--faint); margin-top: 32px; }
  .about ul { color: #c9c8c3; font-size: 14px; padding-left: 20px; }
  .about li { margin-bottom: 6px; }
  details { margin-top: 12px; font-size: 13px; color: #c9c8c3; }
  summary { cursor: pointer; color: var(--text); }
  table { border-collapse: collapse; margin-top: 10px; width: 100%; max-width: 560px; }
  td { padding: 4px 8px; border-bottom: 1px solid var(--faint); }
  td:last-child { text-align: right; color: var(--muted); white-space: nowrap; }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 24px 16px 48px; }
  footer a { color: var(--muted); }

  /* Mobile summary bar */
  .mbar { display: none; }
  @media (max-width: 899px) {
    .mbar { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; gap: 12px; align-items: center; justify-content: space-between;
      background: rgba(22,24,27,.95); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--faint);
      padding: 10px 16px; font-size: 12.5px; color: #c9c8c3; }
    .mbar b { font-size: 18px; color: var(--text); }
    .mbar .r b { color: var(--red); }
    body { padding-bottom: 64px; }
  }
</style>
</head>
<body>

<div class="bar-top">
  <div class="wrap">
    <label class="ctl"><span data-i18n="ctlCountry"></span><select id="country"></select></label>
    <label class="ctl"><span data-i18n="ctlTip"></span><select id="tip"></select></label>
    <div class="lang" role="group" aria-label="Language"><button data-lang="en">EN</button><button data-lang="ja">日本語</button></div>
  </div>
</div>

<div class="wrap">
  <header class="hero">
    <p class="eyebrow">Personal Simulator</p>
    <h1 data-i18n="h1"></h1>
    <p class="lead" data-i18n="lead"></p>
  </header>

  <div class="layout">
    <div id="inputs"></div>

    <aside class="result" aria-live="polite">
      <div class="k" data-i18n="resTitle"></div>
      <div class="total num"><span id="total">0</span><small>kg CO₂</small></div>
      <div class="vs" id="vs"></div>
      <div class="stack" id="stack"></div>
      <div class="legend" id="legend"></div>
      <div class="scale-tabs" role="group" id="scaleTabs"></div>
      <div class="impact">
        <div class="big num" id="impBig"></div>
        <div class="cap" id="impCap"></div>
        <div class="sub" id="impSub"></div>
      </div>
    </aside>
  </div>

  <section class="plate">
    <p class="eyebrow">Your plate, unpacked</p>
    <h2 data-i18n="plateH"></h2>
    <p class="lead" data-i18n="plateLead"></p>
    <div class="gwp-row"><span data-i18n="gwpLabel"></span><div class="chips" id="gwpChips2"></div></div>
    <p class="hint" data-i18n="gwpHint"></p>
    <div class="gwp-row"><span data-i18n="cocLabel"></span><div class="chips" id="cocChips2"></div></div>
    <div id="cocMore" style="max-width:560px">
      <div class="sub-label" data-i18n="cocRate"></div>
      <div class="row"><input type="range" id="cocRate" min="0.1" max="1.5" step="0.1" value="0.5"><span class="val num" id="cocRateV" style="min-width:120px"></span></div>
    </div>
    <p class="hint" data-i18n="cocHint"></p>
    <div class="pstats">
      <div><div class="k" data-i18n="pFoodK"></div><div class="v num" id="pFoodV"></div><div class="s" id="pFoodS"></div></div>
      <div><div class="k" data-i18n="pLandK"></div><div class="v num" id="pLandV"></div><div class="s" id="pLandS"></div></div>
      <div><div class="k" id="pScaleK"></div><div class="v num" id="pScaleV"></div><div class="s" id="pScaleS"></div></div>
    </div>
    <h3 class="ph3" data-i18n="perMealH"></h3>
    <div id="mbars"></div>
    <div class="slegend" id="slegend"></div>
    <h3 class="ph3" data-i18n="swapH"></h3>
    <div class="tbl-wrap"><table class="swapt" id="swapT"></table></div>
    <p class="hint" id="swapNote"></p>
    <p class="note-box" data-i18n="notIncl"></p>
  </section>

  <section class="cmpfood">
    <p class="eyebrow">Beyond carbon</p>
    <h2 data-i18n="cfH"></h2>
    <p class="lead" data-i18n="cfLead"></p>
    <div class="gwp-row"><span data-i18n="cfSel"></span><div class="chips" id="selChips"></div></div>
    <div class="gwp-row" style="margin-top:12px"><span data-i18n="cfBasis"></span><div class="chips" id="basisChips"></div></div>
    <div class="vs-cards" id="vsCards"></div>
    <div class="fpanels" id="fpanels"></div>
    <p class="note-box" data-i18n="cfNote"></p>
  </section>

  <section class="whatif">
    <p class="eyebrow">What if</p>
    <h2 data-i18n="wiH"></h2>
    <p class="lead" id="wiLead"></p>
    <div class="swaps" id="swaps"></div>
    <p class="empty" id="noSwaps" data-i18n="noSwaps" hidden></p>
    <div class="saved" id="savedBox">
      <div><div class="k" data-i18n="improved"></div><div class="v num" id="impKg">—</div><div class="s" id="impPct"></div></div>
      <div><div class="k" id="savedCK"></div><div class="v num" id="savedC">—</div><div class="s" id="savedCS"></div></div>
      <div><div class="k" data-i18n="savedWK"></div><div class="v num" id="savedW">—</div><div class="s" id="savedWS"></div></div>
    </div>
  </section>

  <section class="about">
    <p class="eyebrow">About the numbers</p>
    <h2 style="font-size:22px" data-i18n="aboutH"></h2>
    <ul id="aboutList"></ul>
    <details><summary data-i18n="factorsH"></summary><table id="factors"></table></details>
  </section>
</div>

<footer data-i18n="footer"></footer>

<div class="mbar"><div><span data-i18n="mToday"></span><br><b class="num" id="mKg">0</b> kg CO₂</div><div class="r" style="text-align:right"><span id="mScale"></span><br><b class="num" id="mImp">—</b></div></div>

<script>
/* ===================== DATA ===================== */

// 土地の機会費用：農地として使い続けることで失われる、森林回復による吸収 ＝ 農地(m²·年) × 吸収量(kg CO₂/m²/年)
function mealStages(m, gwp = S.gwp, coc = S.coc) {
  const p = MEAL.portion[m], k = gwp === 20 ? GWP20K : 1, sh = MEAL.ch4Share[m];
  const st = MEAL.stages[m].map(x => x * p);
  st[1] = st[1] * (1 - sh + sh * k) + MEAL.side[1] * (1 - MEAL.sideCh4 + MEAL.sideCh4 * k);
  [0, 2, 3].forEach(i => { st[i] += MEAL.side[i]; });
  st.push(coc ? mealLand(m) * S.cocRate : 0);
  return st;
}
const mealKg = (m, gwp, coc) => mealStages(m, gwp, coc).reduce((a, b) => a + b, 0);

const S = {

         short: 1, long: 1, shop: { coffee: 1, bottle: 1, parcel: 1, tshirt: 0, jeans: 0, shoes: 0, phone: 0, laptop: 0 } },

};
const $ = id => document.getElementById(id);
const L = () => I18N[S.lang];
const tpl = (s, v = {}) => s.replace(/\{(\w+)\}/g, (_, x) => v[x] ?? '');
const C = () => COUNTRIES[S.country];
const mult = () => TIPS[S.tip].m;
const cname = () => S.lang === 'ja' ? C().jaIn : C().enIn;
const fmt = n => Math.round(n).toLocaleString('en-US');
const trim = s => s.replace(/\.0$/, '');
function people(n) {
  if (S.lang === 'ja') {
    if (n >= 1e8) return trim((Math.round(n / 1e7) / 10).toFixed(1)) + '億人';
    if (n >= 1e5) return Math.round(n / 1e4).toLocaleString() + '万人';
    return fmt(n) + '人';
  }
  if (n >= 1e9) return trim((n / 1e9).toFixed(1)) + ' billion';
  if (n >= 1e6) return (n >= 1e7 ? Math.round(n / 1e6) : trim((n / 1e6).toFixed(1))) + ' million';
  return fmt(n) + (n === 1 ? ' life' : ' lives');
}
const kg = n => n >= 100 ? fmt(n) : n.toFixed(1);
const span = days => days >= 365 ? tpl(L().years, { n: fmt(days / 365) }) : tpl(L().days, { n: fmt(days) });

/* ===================== MODEL ===================== */
function footprint(d) {
  const grid = C().grid;
  const perKm = d.mode === 'ev' ? F.evKwhPerKm * grid : F.transport[d.mode];
  const hvac = d.hvac === 'off' ? 0 : d.hvac === 'kero' ? F.keroKgPerH * d.hours : F.hvacKwhPerH[d.hvac] * d.hours * grid;
  const r = {
    transport: perKm * d.km,
    food: d.meals.reduce((s, m) => s + mealKg(m), 0),
    home: hvac * (d.eco ? F.eco : 1) + F.applKwh[d.appl] * grid,
    flights: (d.short * F.flight.short + d.long * F.flight.long) / 365,
    shopping: Object.entries(d.shop).reduce((s, [k, n]) => s + F.shop[k] * n, 0),
  };
  r.total = CATS.reduce((s, c) => s + r[c], 0);
  return r;
}
const clone = d => JSON.parse(JSON.stringify(d));
// 「もし…」の変更。順番に適用して改善後の1日を作る
const SWAPS = [
  { id: 'toTrain',       ok: d => ['car', 'hybrid', 'ev', 'bus'].includes(d.mode) && d.km > 10, apply: d => { d.mode = 'train'; } },
  { id: 'toBike',        ok: d => d.mode !== 'walk' && d.km > 0 && d.km <= 10,                   apply: d => { d.mode = 'walk'; } },
  { id: 'beefToChicken', ok: d => d.meals.includes('beef'),                                     apply: d => { d.meals = d.meals.map(m => m === 'beef' ? 'chicken' : m); } },
  { id: 'onePlant',      ok: d => d.meals.some(m => m !== 'vegan'),
    apply: d => { const i = d.meals.reduce((b, m, j) => mealKg(m) > mealKg(d.meals[b]) ? j : b, 0); if (d.meals[i] !== 'vegan') d.meals[i] = 'vegan'; } },
  { id: 'eco',           ok: d => d.hvac !== 'off' && d.hours > 0 && !d.eco,                    apply: d => { d.eco = true; } },
  { id: 'keroToAC',      ok: d => d.hvac === 'kero' && d.hours > 0,                             apply: d => { d.hvac = 'heat'; } },
  { id: 'lessLong',      ok: d => d.long > 0,                                                   apply: d => { d.long = Math.max(0, d.long - 1); } },
  { id: 'lessShort',     ok: d => d.short > 0,                                                  apply: d => { d.short = Math.max(0, d.short - 1); } },
  { id: 'noNew',         ok: d => ['tshirt', 'jeans', 'shoes', 'phone', 'laptop'].some(k => d.shop[k] > 0),
    apply: d => { ['tshirt', 'jeans', 'shoes', 'phone', 'laptop'].forEach(k => { d.shop[k] = 0; }); } },
  { id: 'refill',        ok: d => d.shop.bottle > 0,                                            apply: d => { d.shop.bottle = 0; } },
];
const deathsPerKg = () => mult() / 1e6;       // 1,000 t = 1e6 kg ≒ 1人
const livesPerYear = (kgDay, pop) => kgDay * 365 * pop * deathsPerKg();

/* ===================== BUILD INPUTS ===================== */

/* ===================== RENDER ===================== */
function renderStatic() {
  const l = L();
  document.documentElement.lang = S.lang;
  document.title = l.title;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.innerHTML = l[el.dataset.i18n]; });
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === S.lang)));
  $('country').innerHTML = Object.entries(COUNTRIES).map(([k, c]) => `<option value="${k}">${c[S.lang]}</option>`).join('');
  $('country').value = S.country;
  $('tip').innerHTML = TIPS.map((x, i) => `<option value="${i}">${x[S.lang]}</option>`).join('');
  $('tip').value = S.tip;
  buildInputs();
  update();
}

function update() {
  const l = L(), d = S.day, fp = footprint(d), c = C();
  // 入力の表示値
  $('kmV').textContent = d.km + ' km';
  if ($('hoursV')) $('hoursV').textContent = d.hours + (S.lang === 'ja' ? ' 時間' : ' h');
  CATS.forEach(k => { $('kg-' + k).textContent = kg(fp[k]) + ' kg'; });

  // 合計と内訳
  $('total').textContent = kg(fp.total);
  $('mKg').textContent = kg(fp.total);
  const avg = c.gt * 1e12 / c.pop / 365;
  $('vs').textContent = tpl(l.vs, { where: cname(), avg: avg.toFixed(1) });
  $('stack').innerHTML = CATS.map(k => `<span style="width:${fp.total ? fp[k] / fp.total * 100 : 0}%;background:var(--c-${k})"></span>`).join('');
  $('legend').innerHTML = CATS.map(k => `<div><i style="background:var(--c-${k})"></i>${l.cat[k]}<span class="n num">${fp.total ? Math.round(fp[k] / fp.total * 100) : 0}%</span></div>`).join('');

  // 規模の切り替え
  $('scaleTabs').innerHTML = ['you', 'country', 'world'].map(s =>
    `<button data-scale="${s}" aria-pressed="${S.scale === s}">${tpl(l.scale[s], { name: c[S.lang] })}</button>`).join('');
  const perDayDeaths = pop => fp.total * pop * deathsPerKg();
  if (S.scale === 'you') {
    const days = fp.total > 0 ? 1 / (fp.total * deathsPerKg()) : Infinity;
    $('impBig').textContent = isFinite(days) ? tpl(l.youBig, { n: span(days) }) : '—';
    $('impCap').innerHTML = isFinite(days) ? tpl(l.youCap, { n: span(days) }) : '';
    $('impSub').innerHTML = tpl(l.youSub, { x: (fp.total * 365 * 80 * deathsPerKg()).toFixed(2) });
    $('mScale').textContent = l.scale.you; $('mImp').textContent = isFinite(days) ? tpl(l.youBig, { n: span(days) }) : '—';
  } else {
    const pop = S.scale === 'world' ? COUNTRIES.world.pop : c.pop;
    const name = S.scale === 'world' ? (S.lang === 'ja' ? '世界' : 'the world') : cname();
    const pd = perDayDeaths(pop), py = pd * 365, yrs = WW2 / py;
    $('impBig').textContent = people(pd);
    $('impCap').innerHTML = tpl(l.massCap, { name, pop: people(pop).replace(/ (lives|life)$/, '') });
    $('impSub').innerHTML = py > 0 ? tpl(l.massSub, { y: people(py),
      t: yrs >= 1 ? tpl(l.years, { n: yrs >= 10 ? fmt(yrs) : trim(yrs.toFixed(1)) }) : tpl(l.months, { n: Math.max(1, Math.round(yrs * 12)) }) }) : '';
    $('mScale').textContent = tpl(l.scale[S.scale], { name: c[S.lang] }); $('mImp').textContent = people(pd) + (S.lang === 'ja' ? '/日' : '/day');
  }

  // もし…
  $('wiLead').innerHTML = tpl(l.wiLead, { name: cname() });
  const avail = SWAPS.filter(s => s.ok(d));
  S.swaps.forEach(id => { if (!avail.some(s => s.id === id)) S.swaps.delete(id); });
  $('swaps').innerHTML = avail.map(s => {
    const alt = clone(d); s.apply(alt);
    const saved = fp.total - footprint(alt).total;
    return `<button class="swap" data-swap="${s.id}" aria-pressed="${S.swaps.has(s.id)}"><span class="box"></span><span>
      <b>${l.sw[s.id]}</b><span class="d">${tpl(l.swD, { kg: kg(saved), lives: people(livesPerYear(saved, c.pop)), name: cname() })}</span></span></button>`;
  }).join('');
  $('noSwaps').hidden = avail.length > 0;
  const imp = clone(d);
  SWAPS.forEach(s => { if (S.swaps.has(s.id) && s.ok(imp)) s.apply(imp); });
  const after = footprint(imp).total, saved = fp.total - after;
  $('impKg').textContent = kg(after) + ' kg';
  $('impPct').textContent = tpl(l.impPct, { kg: kg(saved), pct: fp.total ? Math.round(saved / fp.total * 100) : 0 });
  $('savedCK').textContent = tpl(l.savedCK, { name: cname() });
  const sc = livesPerYear(saved, c.pop), sw = livesPerYear(saved, COUNTRIES.world.pop);
  $('savedC').textContent = saved > 0 ? people(sc) : '—';
  $('savedCS').textContent = saved > 0 ? tpl(l.savedS, { x: trim((sc / WW2 * 100).toFixed(sc / WW2 < 0.1 ? 1 : 0)) }) : '';
  $('savedW').textContent = saved > 0 ? people(sw) : '—';
  $('savedWS').textContent = saved > 0 ? tpl(l.savedS, { x: fmt(sw / WW2 * 100) }) : '';

  renderPlate();
  renderCompare();

  // 説明
  $('aboutList').innerHTML = l.about.map(s => `<li>${tpl(s, { where: cname(), grid: c.grid })}</li>`).join('');
  const fr = l.fRows, rows = [
    ...Object.keys(F.transport).map(m => [l.mode[m], (m === 'ev' ? +(F.evKwhPerKm * c.grid).toFixed(3) : F.transport[m]) + ' kg ' + fr.perKm]),
    ...Object.keys(MEAL.portion).map(m => [l.meal[m], mealKg(m).toFixed(2) + ' kg ' + fr.perMeal + (S.gwp === 20 ? ' (GWP20)' : '') + (S.coc ? ' +COC' : '')]),
    [l.hvac.cool, F.hvacKwhPerH.cool + ' kWh ' + fr.perH], [l.hvac.heat, F.hvacKwhPerH.heat + ' kWh ' + fr.perH], [l.hvac.kero, F.keroKgPerH + ' kg ' + fr.perH],
    ...Object.keys(F.applKwh).map(a => [l.appl + ' — ' + l.applOpt[a], F.applKwh[a] + ' kWh ' + fr.perDay]),
    [l.fShort, F.flight.short + ' kg ' + fr.perTrip], [l.fLong, F.flight.long + ' kg ' + fr.perTrip],
    ...Object.keys(F.shop).map(k => [l.shop[k], F.shop[k] + ' kg ' + fr.perItem]),
  ];
  $('factors').innerHTML = rows.map(([a, b]) => `<tr><td>${a}</td><td class="num">${b}</td></tr>`).join('');
}

function renderPlate() {
  const l = L(), d = S.day, c = C();
  $('gwpChips2').innerHTML = gwpChips();
  $('cocChips2').innerHTML = cocChips();
  $('cocMore').hidden = !S.coc;
  $('cocRateV').textContent = S.cocRate.toFixed(1) + l.cocUnit;
  // 今日の食事
  const st = [0, 0, 0, 0, 0];
  d.meals.forEach(m => mealStages(m).forEach((v, i) => { st[i] += v; }));
  const food = st.reduce((a, b) => a + b, 0), land = d.meals.reduce((a, m) => a + mealLand(m), 0);
  $('pFoodV').textContent = kg(food) + ' kg';
  $('pFoodS').textContent = tpl(l.pFoodS, { m: Math.round(st[1] / food * 100), d: Math.round(st[0] / food * 100) })
    + (S.coc ? tpl(l.pFoodSc, { c: Math.round(st[4] / food * 100) }) : '');
  $('pLandV').textContent = fmt(land) + ' m²';
  $('pLandS').textContent = tpl(l.pLandS, { n: S.lang === 'ja' ? fmt(land / 1.62) : trim((land / 12.5).toFixed(1)) });
  const km2 = land * 365 * c.pop / 1e6, x = km2 / c.area;
  $('pScaleK').textContent = tpl(l.pScaleK, { name: cname() });
  $('pScaleV').textContent = tpl(l.pScaleV, { x: x >= 10 ? fmt(x) : trim(x.toFixed(1)) });
  $('pScaleS').textContent = tpl(S.country === 'world' ? l.pScaleSW : l.pScaleS, { km: fmt(Math.round(km2 / 1000) * 1000), name: cname() });

  // 1食あたりの比較（目盛りは「GWP20＋機会費用」の最大値に固定し、切り替えで伸びが見えるようにする）
  const meals = Object.keys(MEAL.portion), max = Math.max(...meals.map(m => mealKg(m, 20, true)));
  $('mbars').innerHTML = meals.map(m => {
    const n = d.meals.filter(x => x === m).length, ms = mealStages(m);
    return `<div class="mrow${n ? ' today' : ''}"><div class="mn">${l.meal[m]}${n ? `<span class="badge">${tpl(l.todayBadge, { n })}</span>` : ''}</div>
      <div class="mb">${ms.map((v, i) => `<span class="${STAGES[i]}" style="width:${v / max * 100}%;background-color:var(--s-${STAGES[i]})" title="${l.stage[STAGES[i]]}: ${v.toFixed(2)} kg"></span>`).join('')}</div>
      <div class="mv num">${mealKg(m).toFixed(1)} kg</div></div>`;
  }).join('');
  $('slegend').innerHTML = STAGES.filter(s => s !== 'coc' || S.coc).map(s => `<span><i style="background:var(--s-${s})"></i>${l.stage[s]}</span>`).join('');

  // 牛肉1食を置き換えた場合
  $('swapT').innerHTML = `<tr>${l.swapCols.map((h, i) => `<th>${tpl(h, { name: cname() })}${S.coc && (i === 1 || i === 2) ? '<br>' + l.cocCol : ''}</th>`).join('')}</tr>` +
    [['chicken', l.toChicken], ['vegan', l.toPlant]].map(([to, label]) => {
      const d100 = mealKg('beef', 100) - mealKg(to, 100), d20 = mealKg('beef', 20) - mealKg(to, 20);
      const lives = livesPerYear(mealKg('beef') - mealKg(to), c.pop);
      return `<tr><td>${label}</td><td class="num">−${d100.toFixed(1)} kg</td><td class="num">−${d20.toFixed(1)} kg</td>
        <td class="num">−${fmt(mealLand('beef') - mealLand(to))} m²</td><td class="num g">${people(lives)}</td></tr>`;
    }).join('');
  $('swapNote').textContent = tpl(l.swapNote, { name: cname() });
}

function renderCompare() {
  const l = L(), b = S.basis;
  const sel = S.sel, sname = l.food[sel];
  $('selChips').innerHTML = Object.keys(FOODS).filter(f => !PLANTS.includes(f)).map(f => chip('sel', f, l.food[f], sel === f)).join('');
  $('basisChips').innerHTML = ['protein', 'kg'].map(v => chip('basis', v, l.basis[v], b === v)).join('');
  // 基準：たんぱく質100 gあたり ＝ 1 kgあたり ÷ (たんぱく質割合 × 10)
  const val = (f, ind) => { const x = FOODS[f][ind]; return b === 'protein' ? x / (FOODS[f].protein * 10) : x; };
  const num = v => v >= 100 ? fmt(v) : v >= 10 ? v.toFixed(1) : v.toFixed(2);
  const rx = x => x >= 10 ? fmt(x) : trim(x.toFixed(1));

  // 選んだ食材と植物性の倍率
  const cards = INDICATORS.map(ind => {
    const c = val(sel, ind), r = PLANTS.map(p => c / val(p, ind)), lo = Math.min(...r), hi = Math.max(...r);
    const x = Math.abs(hi - lo) < 0.25 ? tpl(l.times, { x: rx(lo) }) : tpl(l.times, { x: rx(lo) + '–' + rx(hi) });
    return `<div><div class="k">${tpl(l.vsK, { ind: l.ind[ind], food: sname })}</div><div class="v num">${x}</div>
      <div class="s">${tpl(l.vsS, { food: sname, c: num(c), t: num(val('tofu', ind)), p: num(val('peas', ind)) })} ${l.unit[ind]}</div></div>`;
  });
  const per100kgProtein = f => FOODS[f].animals / FOODS[f].protein * 100;
  if (FOODS[sel].animals) {
    const n = per100kgProtein(sel), ratio = n / per100kgProtein('beef');
    cards.push(`<div class="animal"><div class="k">${tpl(l.animalK, { food: sname })}</div><div class="v num">${tpl(l.animalV, { n: n >= 10 ? fmt(n) : trim(n.toFixed(1)), u: l.animalU[sel] })}</div>
      <div class="s">${sel === 'beef' ? l.animalSB : tpl(l.animalS, { x: fmt(ratio) })}</div></div>`);
  }
  $('vsCards').innerHTML = cards.join('');

  // 指標ごとの棒グラフ（桁違いの値は棒を省略して、鶏肉と植物性の差が見えるようにする）
  const panel = (title, unit, rows) => {
    const vs = rows.map(r => r.v).sort((a, b) => b - a);
    let cap = (vs[2] ?? vs[0]) * 1.15;
    if (vs[0] <= cap * 1.3) cap = vs[0] * 1.02;
    const anyBroken = rows.some(r => r.v > cap);
    return `<div class="fpanel"><h4>${title}</h4><div class="u">${unit}</div>${rows.map(r => {
      const cls = r.f === sel ? 'hl-sel' : PLANTS.includes(r.f) ? 'hl-plant' : '';
      const col = r.f === sel ? 'var(--amber)' : PLANTS.includes(r.f) ? 'var(--green)' : '#6b7078';
      return `<div class="frow ${cls}"><span class="fn">${l.food[r.f]}</span>
        <div class="fb${r.v > cap ? ' broken' : ''}"><span style="width:${Math.min(1, r.v / cap) * 100}%;background:${col}"></span></div>
        <span class="fv">${num(r.v)}</span></div>`;
    }).join('')}${anyBroken ? `<div class="brk">${l.brk}</div>` : ''}</div>`;
  };
  const foods = Object.keys(FOODS);
  const panels = INDICATORS.map(ind => panel(l.ind[ind], l.unit[ind] + ' / ' + l.basis[b].replace(/（.*|\s*\(.*/, ''), foods.map(f => ({ f, v: val(f, ind) }))));
  const meats = foods.filter(f => FOODS[f].animals);
  panels.push(panel(l.ind.animals, l.unitAnimals[b], meats.map(f => ({ f, v: b === 'protein' ? per100kgProtein(f) : FOODS[f].animals * 1000 }))));
  $('fpanels').innerHTML = panels.join('');
}

/* ===================== EVENTS ===================== */
document.addEventListener('click', e => {
  const t = e.target.closest('button, .item');
  if (!t) return;
  const d = S.day;
  if (t.dataset.lang) { S.lang = t.dataset.lang; store.set('scw-lang', S.lang); renderStatic(); return; }
  if (t.dataset.scale) { S.scale = t.dataset.scale; update(); return; }
  if (t.dataset.swap) { S.swaps.has(t.dataset.swap) ? S.swaps.delete(t.dataset.swap) : S.swaps.add(t.dataset.swap); update(); return; }
  if (t.dataset.step) { const k = t.dataset.step; d[k] = Math.min(20, Math.max(0, d[k] + +t.dataset.d)); $('n-' + k).textContent = d[k]; update(); return; }
  if (t.dataset.minus) { e.stopPropagation(); d.shop[t.dataset.minus] = Math.max(0, d.shop[t.dataset.minus] - 1); buildInputs(); update(); return; }
  if (t.dataset.shop) { d.shop[t.dataset.shop] = Math.min(20, d.shop[t.dataset.shop] + 1); buildInputs(); update(); return; }
  if (t.dataset.g) {
    const g = t.dataset.g, v = t.dataset.v;
    if (g === 'gwp') { S.gwp = +v; buildInputs(); update(); return; }
    if (g === 'basis') { S.basis = v; renderCompare(); return; }
    if (g === 'sel') { S.sel = v; renderCompare(); return; }
    if (g === 'coc') { S.coc = v === '1'; buildInputs(); update(); return; }
    if (g === 'mode') d.mode = v;
    else if (g === 'hvac') { d.hvac = v; $('hvacMore').hidden = v === 'off'; }
    else if (g === 'appl') d.appl = v;
    else if (g.startsWith('meal')) d.meals[+g.slice(4)] = v;
    t.parentElement.querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', String(b === t)));
    update();
  }
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList?.contains('item')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'km') S.day.km = +e.target.value;
  else if (e.target.id === 'hours') S.day.hours = +e.target.value;
  else if (e.target.id === 'eco') S.day.eco = e.target.checked;
  else if (e.target.id === 'cocRate') S.cocRate = +e.target.value;
  else return;
  update();
});
$('country').addEventListener('change', e => { S.country = e.target.value; update(); });
$('tip').addEventListener('change', e => { S.tip = +e.target.value; update(); });

renderStatic();
</script>
</body>
</html>
