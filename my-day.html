<style>
  :root {
    --bg: #0e0f11; --bg2: #16181b; --bg3: #1d2024; --text: #ecebe7; --muted: #8d8f94; --faint: #34373c;
    --red: #e5483b; --green: #4fb38a; --amber: #e0a43b;
    --s-luc: #b0703f; --s-farm: #e0a43b; --s-feed: #86b35c; --s-post: #6b7078; --s-coc: #2f7d62;
    --c-transport: #e5483b; --c-food: #e0a43b; --c-home: #5b9bd5; --c-flights: #a983e0; --c-shopping: #4fb38a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); line-height: 1.7;
    font-family: Inter, "Noto Sans JP", -apple-system, "Hiragino Sans", sans-serif; -webkit-font-smoothing: antialiased; }
  html[lang="ja"] body { font-family: "Noto Sans JP", -apple-system, "Hiragino Sans", sans-serif; }
  .num { font-family: Inter, -apple-system, sans-serif; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }
  a { color: var(--text); }
  [hidden] { display: none !important; }

  /* Control bar */
  .bar-top { position: sticky; top: 0; z-index: 20; background: rgba(14,15,17,.88); backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--faint); }
  .bar-top .wrap { display: flex; align-items: center; gap: 10px 16px; padding-top: 10px; padding-bottom: 10px; flex-wrap: wrap; }
  .ctl { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  select { font: inherit; font-size: 13px; color: var(--text); background: var(--bg2); border: 1px solid var(--faint);
    border-radius: 8px; padding: 6px 28px 6px 10px; appearance: none; -webkit-appearance: none; cursor: pointer; max-width: 62vw;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: right 13px center, right 8px center; background-size: 5px 5px; background-repeat: no-repeat; }
  .lang { margin-left: auto; display: flex; border: 1px solid var(--faint); border-radius: 8px; overflow: hidden; }
  .lang button { font: inherit; font-size: 12px; background: transparent; color: var(--muted); border: 0; padding: 6px 12px; cursor: pointer; }
  .lang button[aria-pressed="true"] { background: var(--text); color: var(--bg); font-weight: 700; }

  /* Hero */
  .hero { padding: 72px 0 48px; }
  .eyebrow { font-size: 12px; letter-spacing: .2em; color: var(--muted); text-transform: uppercase; margin: 0 0 14px; }
  h1 { font-size: clamp(30px, 6vw, 52px); line-height: 1.2; margin: 0 0 18px; font-weight: 900; }
  .lead { font-size: clamp(15px, 2.2vw, 17px); color: #c9c8c3; max-width: 660px; margin: 0; }
  h2 { font-size: clamp(22px, 3.6vw, 30px); line-height: 1.35; margin: 0 0 12px; font-weight: 900; }

  /* Layout */
  .layout { display: grid; gap: 24px; grid-template-columns: 1fr; padding-bottom: 32px; }
  @media (min-width: 900px) { .layout { grid-template-columns: 1fr 380px; align-items: start; } .result { position: sticky; top: 72px; } }

  /* Input blocks */
  .block { background: var(--bg2); border: 1px solid var(--faint); border-radius: 14px; padding: 20px; margin-bottom: 16px; }
  .block h3 { margin: 0 0 4px; font-size: 16px; display: flex; align-items: center; gap: 10px; }
  .block h3 .dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .block h3 .kg { margin-left: auto; font-size: 13px; color: var(--muted); font-weight: 500; }
  .hint { font-size: 12px; color: var(--muted); margin: 0 0 12px; }
  .sub-label { font-size: 13px; color: #c9c8c3; margin: 14px 0 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font: inherit; font-size: 13px; color: var(--text); background: var(--bg3); border: 1px solid var(--faint); border-radius: 999px;
    padding: 6px 12px; cursor: pointer; transition: border-color .15s, background .15s; line-height: 1.4; }
  .chip:hover { border-color: #55595f; }
  .chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); font-weight: 700; }
  .chip small { opacity: .65; font-weight: 400; margin-left: 4px; }
  .meal-row { display: grid; grid-template-columns: 64px 1fr; gap: 8px; align-items: center; margin-top: 10px; }
  .meal-row > span { font-size: 13px; color: #c9c8c3; }
  .row { display: flex; align-items: center; gap: 12px; }
  input[type=range] { flex: 1; accent-color: var(--text); }
  .val { min-width: 64px; text-align: right; font-weight: 700; }
  .toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; margin-top: 12px; cursor: pointer; color: #c9c8c3; }
  .toggle input { accent-color: var(--green); width: 16px; height: 16px; }
  .stepper { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--faint); }
  .stepper:first-of-type { border-top: 0; }
  .stepper .lbl { font-size: 13.5px; }
  .stepper .lbl small { display: block; color: var(--muted); font-size: 11.5px; }
  .step { display: flex; align-items: center; gap: 4px; flex: none; }
  .step button { font: inherit; width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--faint); background: var(--bg3);
    color: var(--text); cursor: pointer; font-size: 16px; line-height: 1; }
  .step b { min-width: 28px; text-align: center; }
  .shop-h { margin: 16px 0 8px; display: flex; flex-direction: column; gap: 2px; }
  .shop-h b { font-size: 13.5px; }
  .shop-h span { font-size: 12px; color: var(--muted); }
  .item .big-kg { font-size: 18px; font-weight: 800; margin-top: 2px; }
  .item.per .swatch { position: absolute; top: 12px; right: 34px; width: 12px; height: 12px; border-radius: 3px; background: var(--ic); }
  .item.per.off .swatch { opacity: .35; }
  .item.per b { padding-right: 46px; }
  .item.per .tick { position: absolute; top: 9px; right: 9px; width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid #55595f; }
  .item.per.on .tick { background: var(--c-shopping); border-color: var(--c-shopping); }
  .item.per.on .tick::after { content: ""; position: absolute; left: 5px; top: 1px; width: 5px; height: 10px; border: solid #0b1a13; border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .item.per.off { opacity: .5; }
  .item .assume { font-size: 11.5px; color: #c9c8c3; margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--faint); }
  .item .assume .num { color: var(--c-shopping); font-weight: 700; }
  .ref-note { margin: 6px 0 4px; font-size: 12px; color: #c9c8c3; }
  .ref-note summary { cursor: pointer; color: var(--amber); font-size: 12px; }
  .ref-note ul { margin: 8px 0 0; padding-left: 18px; }
  .ref-note li { margin-bottom: 4px; line-height: 1.6; }
  .ref-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12.5px; color: #c9c8c3; margin: 4px 0 10px; }
  .ref-row select { font-size: 12.5px; padding: 5px 26px 5px 8px; }
  .brk-wrap { position: relative; }
  .ref-mark { position: absolute; top: -4px; bottom: -4px; width: 2px; background: #ecebe7; transform: translateX(-1px); transition: left .35s ease; }
  .ref-mark span { position: absolute; bottom: -16px; left: 50%; transform: translateX(-50%); font-size: 10px; font-style: normal; color: #ecebe7; white-space: nowrap; }
  .shop-brk { margin-top: 16px; padding: 14px; border-radius: 12px; background: var(--bg3); border: 1px solid var(--faint); }
  .brk-h { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; margin-bottom: 8px; }
  .brk-h span { font-size: 18px; font-weight: 900; color: var(--c-shopping); }
  .brk-wrap { margin-bottom: 14px; }
  .brk-bar { display: flex; height: 18px; border-radius: 6px; overflow: hidden; background: var(--bg); }
  .brk-bar span { transition: width .35s ease; border-right: 1px solid rgba(0,0,0,.35); overflow: hidden; }
  .brk-leg { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 3px 14px; margin-top: 10px; font-size: 12px; color: #c9c8c3; }
  .brk-leg div { display: flex; align-items: center; gap: 6px; }
  .brk-leg div.off { opacity: .4; text-decoration: line-through; }
  .brk-leg i { width: 10px; height: 10px; border-radius: 2px; flex: none; }
  .brk-leg .num { margin-left: auto; color: var(--muted); }
  .brk-share { font-size: 12.5px; color: #c9c8c3; margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--faint); }
  .brk-share b { color: var(--c-shopping); font-size: 15px; }
  .shop { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .item { position: relative; text-align: left; font: inherit; color: var(--text); background: var(--bg3); border: 1px solid var(--faint);
    border-radius: 12px; padding: 10px 12px; cursor: pointer; line-height: 1.4; }
  .item.on { border-color: var(--c-shopping); background: rgba(79,179,138,.08); }
  .item b { display: block; font-size: 13.5px; padding-right: 26px; }
  .item .k { font-size: 12px; color: var(--muted); }
  .item .eq { font-size: 11px; color: var(--muted); opacity: .8; }
  .item .cnt { position: absolute; top: 8px; right: 8px; min-width: 22px; height: 22px; border-radius: 11px; background: var(--c-shopping);
    color: #0b1a13; font-size: 12px; font-weight: 800; display: grid; place-items: center; padding: 0 6px; }
  .item .minus { position: absolute; bottom: 8px; right: 8px; width: 22px; height: 22px; border-radius: 6px; border: 1px solid var(--faint);
    background: var(--bg2); color: var(--text); font-size: 14px; line-height: 1; cursor: pointer; }

  /* Result panel */
  .result { background: var(--bg2); border: 1px solid var(--faint); border-radius: 16px; padding: 22px; }
  .result .k { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .total { font-size: 56px; font-weight: 900; line-height: 1.05; margin: 6px 0 2px; }
  .total small { font-size: 18px; font-weight: 600; color: var(--muted); margin-left: 6px; }
  .vs { font-size: 12.5px; color: var(--muted); }
  .stack { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--faint); margin: 16px 0 8px; }
  .stack span { transition: width .4s ease; }
  .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 12px; font-size: 12px; color: #c9c8c3; }
  .legend div { display: flex; align-items: center; gap: 6px; }
  .legend i { width: 9px; height: 9px; border-radius: 2px; flex: none; }
  .legend .n { margin-left: auto; color: var(--muted); }
  .beef-note { margin-top: 12px; font-size: 12.5px; line-height: 1.65; color: #c9c8c3; padding: 10px 12px; border-radius: 10px; background: var(--bg3); border-left: 3px solid var(--faint); }
  .beef-note.on { border-left-color: var(--red); background: rgba(229,72,59,.08); }
  .beef-note b { color: var(--text); }
  .beef-note.on b { color: var(--red); }
  .whole-leg b { color: var(--red); }
  .coc-line { font-size: 12.5px; color: #c9c8c3; margin: 2px 0 6px; padding: 6px 10px; border-radius: 8px; background: rgba(47,125,98,.14); border: 1px solid rgba(47,125,98,.45); }
  .coc-line b { color: #6fd0a9; }
  .coc-line a { color: #6fd0a9; margin-left: 4px; }
  details.adv { margin-top: 14px; font-size: 13px; background: var(--bg3); border: 1px solid #4a4e55; border-radius: 10px; padding: 10px 14px; max-width: 820px; }
  details.adv > summary { cursor: pointer; color: var(--text); font-size: 13.5px; font-weight: 700; list-style: none; display: flex; align-items: center; gap: 8px; }
  details.adv > summary::-webkit-details-marker { display: none; }
  details.adv > summary::before { content: "⚙"; font-size: 15px; color: var(--amber); }
  details.adv > summary::after { content: "▾"; margin-left: auto; color: var(--muted); transition: transform .2s; }
  details.adv[open] > summary::after { transform: rotate(180deg); }
  details.adv > summary:hover { color: var(--amber); }
  details.adv[open] { border-color: var(--amber); }
  details.adv[open] > summary { margin-bottom: 6px; }
  .plate details.adv { margin-top: 20px; }
  .region-note { margin-top: 6px; color: var(--amber); }
  .swapt tr.best td { background: rgba(79,179,138,.08); }
  .swapt tr.best td:first-child { font-weight: 700; color: var(--green); }
  .swapt .best-tag { display: inline-block; font-size: 10.5px; font-weight: 800; color: #0b1a13; background: var(--green); border-radius: 999px; padding: 0 7px; margin-left: 4px; }
  .swapt tr.meh td:first-child { color: #c9c8c3; }
  .swapt .bad { color: var(--red); font-weight: 700; }
  .swap-call { font-size: 13px; line-height: 1.7; color: #c9c8c3; background: rgba(79,179,138,.07); border-left: 3px solid var(--green); border-radius: 0 10px 10px 0; padding: 12px 14px; margin-top: 12px; max-width: 760px; }
  .swap-call b { color: var(--text); }
  .swap-call a { color: var(--green); margin-left: 4px; }
  details.explain { margin: 16px 0 4px; background: var(--bg2); border: 1px solid var(--faint); border-left: 3px solid var(--s-coc); border-radius: 0 12px 12px 0; padding: 12px 16px; max-width: 820px; }
  details.explain > summary { cursor: pointer; font-weight: 600; font-size: 13.5px; color: #c9c8c3; }
  details.explain > summary:hover { color: var(--text); }
  details.explain p, details.explain li { font-size: 13.5px; line-height: 1.75; color: #c9c8c3; }
  details.explain b { color: var(--text); }
  details.explain ol, details.explain ul { padding-left: 20px; }
  details.explain li { margin-bottom: 8px; }
  details.explain .ex-note { font-size: 12.5px; color: var(--muted); }
  .swapt td.strong { font-weight: 800; }
  .unc-note { font-size: 11.5px; color: var(--muted); margin-top: 8px; line-height: 1.5; }
  .whole { margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--faint); }
  .whole > summary { cursor: pointer; font-size: 12.5px; color: #c9c8c3; list-style: revert; }
  .whole > summary:hover { color: var(--text); }
  .whole[open] > summary { margin-bottom: 8px; color: var(--text); }
  .whole-h { font-size: 12px; color: #c9c8c3; line-height: 1.5; margin-bottom: 8px; }
  .whole-bar { position: relative; display: flex; height: 14px; border-radius: 5px; overflow: hidden; background: var(--bg); }
  .whole-bar span { border-right: 1px solid rgba(0,0,0,.35); transition: width .35s ease; }
  .whole-bar .hh-mark { position: absolute; top: 0; bottom: 0; width: 2px; background: #ecebe7; transform: translateX(-1px); }
  .whole-leg { display: grid; gap: 3px; margin-top: 8px; font-size: 11.5px; color: #c9c8c3; }
  .whole-leg div { display: flex; align-items: flex-start; gap: 6px; line-height: 1.4; }
  .whole-leg i { width: 9px; height: 9px; border-radius: 2px; flex: none; margin-top: 3px; }
  .whole-leg .num { margin-left: auto; color: var(--muted); white-space: nowrap; padding-left: 8px; }
  .whole-leg .over { margin: 4px 0 0; color: var(--amber); font-size: 11.5px; }
  .whole-note { margin-top: 8px; font-size: 11.5px; color: var(--muted); }
  .whole-note summary { cursor: pointer; color: var(--amber); }
  .whole-note p { margin: 6px 0 0; line-height: 1.6; }
  .scale-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--bg); padding: 4px; border-radius: 10px; margin: 22px 0 16px; }
  .scale-tabs button { font: inherit; font-size: 12px; background: transparent; color: var(--muted); border: 0; border-radius: 7px; padding: 8px 4px; cursor: pointer; line-height: 1.3; }
  .scale-tabs button[aria-pressed="true"] { background: var(--bg3); color: var(--text); font-weight: 700; box-shadow: 0 0 0 1px var(--faint); }
  .impact .big { font-size: 40px; font-weight: 900; color: var(--red); line-height: 1.1; }
  .impact .cap { font-size: 13px; color: #c9c8c3; margin-top: 6px; }
  .impact .sub { font-size: 12.5px; color: var(--muted); margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--faint); }

  /* Plate */
  .plate { padding: 56px 0 24px; border-top: 1px solid var(--faint); }
  .gwp-row { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; margin-top: 24px; font-size: 13px; color: #c9c8c3; }
  .plate .hint { margin-top: 8px; max-width: 680px; }
  .pstats { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; margin: 24px 0 8px; }
  .pstats > div { background: var(--bg2); border: 1px solid var(--faint); border-radius: 14px; padding: 18px; }
  .pstats .k { font-size: 12.5px; color: #c9c8c3; }
  .pstats .v { font-size: 32px; font-weight: 900; line-height: 1.2; margin-top: 4px; }
  .pstats .s { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .ph3 { font-size: 15px; margin: 32px 0 12px; }
  .mrow { display: grid; grid-template-columns: 130px 1fr 64px; gap: 10px; align-items: center; padding: 6px 8px; border-radius: 8px; }
  .mrow.today { background: var(--bg2); box-shadow: inset 0 0 0 1px var(--faint); }
  .mrow .mn { font-size: 13px; line-height: 1.3; }
  .mrow .badge { display: inline-block; margin-left: 6px; font-size: 10.5px; color: var(--bg); background: var(--text); border-radius: 999px; padding: 0 6px; font-weight: 700; }
  .mrow .mb { display: flex; height: 16px; border-radius: 4px; overflow: hidden; background: var(--bg3); }
  .mrow .mb span { transition: width .5s ease; }
  .mrow .mv { text-align: right; font-size: 13px; font-weight: 700; }
  @media (max-width: 520px) { .mrow { grid-template-columns: 92px 1fr 54px; gap: 6px; } }
  .slegend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: #c9c8c3; margin-top: 10px; }
  .slegend span { display: inline-flex; align-items: center; gap: 6px; }
  .slegend i { width: 10px; height: 10px; border-radius: 2px; }
  .tbl-wrap { overflow-x: auto; }
  table.swapt { max-width: none; font-size: 13px; }
  .swapt th { text-align: right; font-weight: 500; color: var(--muted); font-size: 11.5px; padding: 4px 8px; border-bottom: 1px solid var(--faint); }
  .swapt td { text-align: right; color: var(--text); }
  .swapt td:first-child, .swapt th:first-child { text-align: left; }
  .swapt td.g { color: var(--green); font-weight: 700; }
  .mrow .mb span.coc { background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.18) 0 3px, transparent 3px 7px); }
  .note-box { font-size: 13px; color: #c9c8c3; background: var(--bg2); border-left: 3px solid var(--s-farm); border-radius: 0 10px 10px 0; padding: 14px 16px; margin-top: 20px; max-width: 760px; }

  .cmp-card { display: flex; align-items: center; gap: 14px; max-width: 760px; margin-top: 12px; padding: 14px 18px; border-radius: 14px; text-decoration: none; color: var(--text);
    border: 1px solid rgba(79,179,138,.55); background: rgba(79,179,138,.08); transition: transform .15s, background .15s; }
  .cmp-card:hover { transform: translateY(-2px); background: rgba(79,179,138,.14); }
  .cmp-card .ic { font-size: 24px; flex: none; }
  .cmp-card b { display: block; font-size: 15px; }
  .cmp-card b + span { font-size: 12.5px; color: #c9c8c3; }
  .cmp-card .go { margin-left: auto; font-size: 20px; color: var(--green); font-weight: 900; flex: none; }
  /* Beyond carbon (link to nature.html) */
  .beyond { padding: 40px 0 8px; border-top: 1px solid var(--faint); }

<script>
/* ===================== DATA ===================== */
const COUNTRIES = {

  uk:     { en: 'United Kingdom', ja: '英国',     enIn: 'the UK',            jaIn: '英国',   gt: 0.31, pop: 6.9e7,  grid: 0.20, area: 0.244e6, cb: 8.85, hh: 2.4 },
};
const TIPS = [
  { m: 1,   en: 'None (1,000-ton rule only)',     ja: 'なし（1,000トン・ルールのみ）' },
  { m: 1.5, en: 'Moderate feedbacks ×1.5',        ja: '中程度のフィードバック ×1.5' },
  { m: 2,   en: 'Tipping-point cascade ×2',       ja: 'ティッピング連鎖 ×2' },
  { m: 3,   en: 'Cascade + societal collapse ×3', ja: '連鎖＋社会的崩壊 ×3' },
];
const WW2 = 80e6;

const F = {
  transport: { walk: 0, train: 0.02, bus: 0.06, ev: null /* 0.15 kWh/km × 電力係数 */, hybrid: 0.08, car: 0.14 },
  evKwhPerKm: 0.15,
  hvacKwhPerH: { cool: 0.5, heat: 0.8 }, keroKgPerH: 0.6, eco: 0.9,
  // 給湯（1人1日あたりに必要な熱、kWh）：シャワー10分 ≒ 120 L を25℃温める ≒ 3.5 kWh、
  // 湯船（約200 Lを世帯2.2人で分ける）＋短いシャワー ≒ 4.4 kWh。給湯器の効率で割ってエネルギー量にする
  water: { shower: 3.5, tub: 5.8, short: 1.75 },   // 湯船（約200 L）は世帯人数で分け、短いシャワー分を足す
  waterEff: { gas: 0.85, electric: 0.9, heatpump: 3.0 },

  greenGrid: 0.03,     // 再エネ100%プランの電気（kg CO₂e/kWh、ライフサイクルの目安）
  applKwh: { low: 1.5, avg: 3, high: 5 },   // 冷暖房以外の電気（1人1日あたりの kWh、目安）
  flight: { short: 150, long: 1500 },       // 往復1回あたり
  shop: { bottle: 0.15, coffee: 0.3, parcel: 0.5, tshirt: 7, jeans: 25, shoes: 14, phone: 70, laptop: 300,
          fridge: 250, aircon: 310, bed: 444, car: 7000, house: 34000 },
  // 製造・建設時の排出（kg/個）。家電は ADEME「Impact CO2」の製造分、車は小〜中型ガソリン車、家具は ADEME「Impact CO2」、家は木造戸建て約126 m²（国交省資料）
};
const CATS = ['transport', 'food', 'home', 'flights', 'shopping'];
// 国全体の消費ベースの排出（cb, t CO₂e/人・年）＝ 消費ベースCO₂（2023年, Global Carbon Budget）×（国内の全ガス / 国内CO₂, 2024年）。
// EU は加盟27か国の人口加重平均、世界は世界の温室効果ガス総量 ÷ 人口。いずれも概算。
// 最終需要の内訳は世界全体の推計を当てはめる（家庭72%・政府10%・投資18%, Hertwich & Peters 2009）。
const FINAL = { household: 0.72, government: 0.10, investment: 0.18 };
// hh ＝ 平均世帯人数（各国統計の概数）。湯船・冷蔵庫・エアコン・家を世帯で分ける計算に使う。想定頻度は日本（2.2人）基準で、他の国はこの比で補正する
const HH_JP = 2.2;
const hhOf = () => C().hh;
const SHARED = ['fridge', 'aircon', 'house'];
const hhAdj = k => SHARED.includes(k) ? HH_JP / hhOf() : 1;
// 買い物は2種類：
//   daily    … この1日を毎日続けるもの（数をそのまま1日分として数える）
//   periodic … ときどき買うもの（想定の頻度 perYear で1日あたりに割り戻す）
const SHOP = {
  daily: ['bottle', 'coffee'],
  periodic: ['parcel', 'tshirt', 'jeans', 'shoes', 'phone', 'laptop', 'fridge', 'aircon', 'bed'],
  big: ['car', 'house'],   // 大きな買い物：モノ（消費財）の平均とは別に加える（統計上は交通・住宅／投資に入るため）
  perYear: { parcel: 52, tshirt: 5, jeans: 1, shoes: 2, phone: 1 / 3, laptop: 1 / 5,
             fridge: 1 / (13 * 2.2),     // 13年使用・世帯で1台・2.2人
             aircon: 3 / (13.5 * 2.2),   // 13.5年使用・世帯に約3台
             bed: 1 / 15,                // 1人1台・15年使用（想定）
             car: 1 / 26,        // 13年ごとに買い替え・2人で1台

  // 想定の頻度（1人1年あたり）
  // 上の品物以外のモノ（家電・家具・日用品など）の目安（kg CO₂e/日）。
  // 日本の平均的な人の消費財は年約1,030 kg ≒ 1日2.8 kg（1.5-Degree Lifestyles, 2019）。上の品物の初期値（約1 kg）＋「ふつう」でおおよそ一致する。
  other: { none: 0, low: 0.5, mid: 1, high: 2 },   // 買い物全体が「比べる平均」の何倍になるか
  colors: { bottle: '#4fb38a', coffee: '#9ad17a', parcel: '#e0a43b', tshirt: '#5b9bd5', jeans: '#3f6fb0', shoes: '#a983e0', phone: '#e57a5a', laptop: '#d4c25a', fridge: '#7fb7c9', aircon: '#a9dde9', bed: '#c9a86a', car: '#c0504d', house: '#b08a5a', other: '#6b7078' },
};
// 平均的な人の消費財（モノ）由来の排出：t = 年あたり t CO₂e、total = 生活由来の排出全体（t/年）
// Hot or Cool Institute (2021) 表3.1（2019年時点）。日本は IGES ほか (2019) の 1,030 kg と同じ値を使う。

const GOODS_REF = {
  high:    { t: 1.48, total: 10.0, en: 'High-income countries (average of Canada, Finland, UK, Japan)', ja: '高所得国（カナダ・フィンランド・英国・日本の平均）', sen: 'high-income countries', sja: '高所得国' },
  japan:   { t: 1.03, total: 8.1,  en: 'Japan', ja: '日本', sen: 'Japan', sja: '日本' },
  canada:  { t: 2.5,  total: 13.6, en: 'Canada', ja: 'カナダ', sen: 'Canada', sja: 'カナダ' },
  uk:      { t: 1.0,  total: 8.5,  en: 'United Kingdom', ja: '英国', sen: 'UK', sja: '英国' },
  finland: { t: 1.4,  total: 9.7,  en: 'Finland (an EU example)', ja: 'フィンランド（EUの例）', sen: 'Finland', sja: 'フィンランド' },
  china:   { t: 0.41, total: 5.0,  en: 'China', ja: '中国', sen: 'China', sja: '中国' },
  india:   { t: 0.01, total: 3.0,  en: 'India', ja: 'インド', sen: 'India', sja: 'インド' },
};
const goodsRefKey = () => S.ref || (S.lang === 'ja' ? 'japan' : 'high');
const pctTxt = x => x >= 1 ? (S.lang === 'ja' ? '約' : 'about ') + Math.round(x) + '%' : (S.lang === 'ja' ? '1%未満' : 'under 1%');
const goodsRefDaily = () => GOODS_REF[goodsRefKey()].t * 1000 / 365.25;
// 買い物・モノの品物（ときどき買うもの）。飲み物は「食事・飲み物」に入れ、モノの平均との比較からは外す
const itemsDaily = d => SHOP.periodic.reduce((a, k) => a + shopPerDay(d, k), 0);
const drinksDaily = d => SHOP.daily.reduce((a, k) => a + shopPerDay(d, k), 0);

// 土地の機会費用：農地として使い続けることで失われる、森林回復による吸収 ＝ 農地(m²·年) × 吸収量(kg CO₂/m²/年)
function mealStages(m, gwp = S.gwp, coc = S.coc) {
  const p = MEAL.portion[m], k = gwp === 20 ? GWP20K : 1, sh = MEAL.ch4Share[m];
  const st = MEAL.stages[m].map(x => x * p);
  st[1] = st[1] * (1 - sh + sh * k) + MEAL.side[1] * (1 - MEAL.sideCh4 + MEAL.sideCh4 * k);
  [0, 2, 3].forEach(i => { st[i] += MEAL.side[i]; });
  st.push(coc ? mealLand(m) * S.cocRate : 0);
  return st;
}

      <ol>
        <li><b>森林破壊・土地利用の変化（初期設定で含めています）</b><br>森林を切り開いて牧草地や飼料畑（大豆・トウモロコシなど）にしたときに、木や土から実際に出たCO₂です。大気に実際に加わった排出なので、1,000トン・ルールでそのまま死者数に換算できます。牛肉1食では、全体約{tot} kgのうち約{luc} kg（茶色の部分）です。</li>

      </ol>
      <p><b>なぜ初期設定では2を含めないのか</b></p>
      <ul>
        <li>カウンター、国の平均、全体像の帯は、すべて「実際の排出」で数えています。2を足すと、比べる基準がずれます。</li>

        <li>同じ考え方は、牛肉だけでなく、すべての農地や都市の土地にも当てはまります。食べ物だけに足すと、ほかとの比較が不公平になります。</li>
      </ul>
      <p><b>では、どちらが実態に近いのか。</b>問いによって違います。「今日、どれだけ排出したか」なら1までです。「食べ方を変えたら、何人の命を救えるか」なら、2を含めたほうが実態に近いと考えられます。牛肉をやめることで、はじめて土地が森林に戻る可能性が生まれるからです。食べ物の比較では2を含めるべきだとする研究もあります（Searchinger ら 2018、Hayek ら 2021）。そのため、下の「牛肉1食を置き換えると」の表では、救える命を両方の見方で並べています。</p>

const trim = s => s.replace(/\.0$/, '');
// 桁の目安の推計なので、小さな数は有効数字2桁に丸めて見せる
const sig = (n, d = 2) => { if (n <= 0) return 0; const p = Math.pow(10, Math.floor(Math.log10(n)) - d + 1); return Math.round(n / p) * p; };
function people(n) {
  if (S.lang === 'ja') {
    if (n >= 1e8) return trim((Math.round(n / 1e7) / 10).toFixed(1)) + '億人';
    if (n >= 1e5) return Math.round(n / 1e4).toLocaleString() + '万人';
    if (n >= 1e4) return trim((n / 1e4).toFixed(1)) + '万人';
    return fmt(sig(n)) + '人';
  }
  if (n >= 1e9) return trim((n / 1e9).toFixed(1)) + ' billion';
  if (n >= 1e6) return (n >= 1e7 ? Math.round(n / 1e6) : trim((n / 1e6).toFixed(1))) + ' million';
  return fmt(sig(n)) + (n === 1 ? ' life' : ' lives');
}
const count = n => S.lang === 'ja'
  ? (n >= 1e8 ? trim((n / 1e8).toFixed(1)) + '億' : n >= 1e4 ? fmt(n / 1e4) + '万' : fmt(n))
  : (n >= 1e9 ? trim((n / 1e9).toFixed(1)) + ' billion' : n >= 1e6 ? fmt(n / 1e6) + ' million' : fmt(n));
const kg = n => n >= 100 ? fmt(n) : n.toFixed(1);

/* ===================== MODEL ===================== */
const gridOf = d => d.green ? F.greenGrid : C().grid;
const waterHeat = d => d.bath === 'shower' ? F.water.shower : F.water.tub / hhOf() + F.water.short;
const waterKg = (d, heater = d.heater) => heater === 'gas' ? waterHeat(d) / F.waterEff.gas * F.gasKgPerKwh : waterHeat(d) / F.waterEff[heater] * gridOf(d);
function footprint(d) {
  const grid = gridOf(d);
  const perKm = d.mode === 'ev' ? F.evKwhPerKm * grid : F.transport[d.mode];
  const hvac = d.hvac === 'off' ? 0 : d.hvac === 'kero' ? F.keroKgPerH * d.hours : F.hvacKwhPerH[d.hvac] * d.hours * grid;
  const r = {
    transport: perKm * d.km,
    food: d.meals.reduce((s, m) => s + mealKg(m), 0) + drinksDaily(d),
    home: hvac * (d.eco ? F.eco : 1) + F.applKwh[d.appl] * grid + waterKg(d),
    flights: (d.short * F.flight.short + d.long * F.flight.long) / 365,
    shopping: itemsDaily(d) + otherDaily(d) + SHOP.big.reduce((a, k) => a + shopPerDay(d, k), 0),
  };
  r.total = CATS.reduce((s, c) => s + r[c], 0);
  return r;
}
const clone = d => JSON.parse(JSON.stringify(d));

const SWAPS = [
  { id: 'toTrain',       ok: d => ['car', 'hybrid', 'ev', 'bus'].includes(d.mode) && d.km > 10, apply: d => { d.mode = 'train'; } },
  { id: 'toBike',        ok: d => d.mode !== 'walk' && d.km > 0 && d.km <= 10,                   apply: d => { d.mode = 'walk'; } },
  { id: 'beefToChicken', ok: d => d.meals.includes('beef'),                                     apply: d => { d.meals = d.meals.map(m => m === 'beef' ? 'chicken' : m); } },
  { id: 'onePlant',      ok: d => d.meals.some(m => m !== 'vegan'),
    apply: d => { const i = d.meals.reduce((b, m, j) => mealKg(m) > mealKg(d.meals[b]) ? j : b, 0); if (d.meals[i] !== 'vegan') d.meals[i] = 'vegan'; } },
  { id: 'eco',           ok: d => d.hvac !== 'off' && d.hours > 0 && !d.eco,                    apply: d => { d.eco = true; } },
  { id: 'greenPower',    ok: d => !d.green,                                                     apply: d => { d.green = true; } },
  { id: 'heatPump',      ok: d => d.heater !== 'heatpump',                                      apply: d => { d.heater = 'heatpump'; } },
  { id: 'keroToAC',      ok: d => d.hvac === 'kero' && d.hours > 0,                             apply: d => { d.hvac = 'heat'; } },
  { id: 'lessLong',      ok: d => d.long > 0,                                                   apply: d => { d.long = Math.max(0, d.long - 1); } },
  { id: 'lessShort',     ok: d => d.short > 0,                                                  apply: d => { d.short = Math.max(0, d.short - 1); } },
  { id: 'fewerClothes',  ok: d => ['tshirt', 'jeans', 'shoes'].some(k => d.own[k]),
    apply: d => { ['tshirt', 'jeans', 'shoes'].forEach(k => { d.per[k] /= 2; }); } },
  { id: 'keepDevices',   ok: d => ['phone', 'laptop'].some(k => d.own[k]),
    apply: d => { ['phone', 'laptop'].forEach(k => { d.per[k] = 1 / (1 / d.per[k] + 2); }); } },
  { id: 'lessStuff',     ok: d => d.other === 'mid' || d.other === 'high',                      apply: d => { d.other = d.other === 'high' ? 'mid' : 'low'; } },
  { id: 'refill',        ok: d => d.shop.bottle > 0,                                            apply: d => { d.shop.bottle = 0; } },
];
const deathsPerKg = () => mult() / 3.664e6;   // 炭素1,000 t ＝ CO₂ 3,664 t ＝ 3.664e6 kg ≒ 1人
const livesPerYear = (kgDay, pop) => kgDay * 365 * pop * deathsPerKg();

function update() {
  const l = L(), d = S.day, fp = footprint(d), c = C();
  // 入力の表示値
  $('kmV').textContent = d.km + ' km';
  if ($('hoursV')) $('hoursV').textContent = d.hours + (S.lang === 'ja' ? ' 時間' : ' h');
  CATS.forEach(k => { $('kg-' + k).textContent = kg(fp[k]) + ' kg'; });
  // 買い物の内訳：目盛りは固定（8 kg/日、超えたら合計に合わせる）なので、品物を外すと棒が目に見えて短くなる
  const ref = GOODS_REF[goodsRefKey()], refD = goodsRefDaily();
  const parts = [...SHOP.periodic.map(k => ({ k, v: shopPerDay(d, k), name: l.shop[k] })), { k: 'other', v: otherDaily(d), name: l.otherLbl },
    ...SHOP.big.map(k => ({ k, v: shopPerDay(d, k), name: l.shop[k] }))];
  const scale = Math.max(4, fp.shopping, refD * 1.1);
  $('refMark').style.left = (refD / scale * 100) + '%';
  $('otherRef').textContent = tpl(l.otherRef, { ref: ref[S.lang], y: fmt(ref.t * 1000), d: refD < 0.1 ? refD.toFixed(2) : refD.toFixed(1), p: pctTxt(ref.t / ref.total * 100), i: defaultItems().toFixed(1) })
    + (shopTarget(d.other) < defaultItems() ? l.otherOver : '');
  $('brkTotal').textContent = kg(fp.shopping) + ' kg';
  $('brkBar').innerHTML = parts.filter(p => p.v > 0).map(p => `<span style="width:${p.v / scale * 100}%;background:${SHOP.colors[p.k]}" title="${p.name}: ${shopKg(p.v)} kg"></span>`).join('');
  $('brkLeg').innerHTML = parts.map(p => `<div class="${p.v > 0 ? '' : 'off'}"><i style="background:${SHOP.colors[p.k]}"></i>${p.name}<span class="num">${p.v > 0 ? shopKg(p.v) + ' kg · ' + Math.round(p.v / fp.shopping * 100) + '%' : l.excluded}</span></div>`).join('');
  $('brkShare').innerHTML = tpl(l.shareLine, { p: fp.total ? Math.round(fp.shopping / fp.total * 100) : 0, r: pctTxt(ref.t / ref.total * 100), ref: S.lang === 'ja' ? ref.sja : ref.sen });

  // 給湯器・電気の契約：選んだ国での1日あたりの値を各ボタンに表示
  Object.keys(F.waterEff).forEach(h => { $('hk-' + h).textContent = kg(waterKg(d, h)) + ' kg'; });
  ['grid', 'green'].forEach(g => { const alt = { ...d, green: g === 'green' }; $('pk-' + g).textContent = tpl(l.homeKg, { kg: kg(footprint(alt).home) }); });
  $('regionNote').textContent = tpl(l.regionNote, { where: cname(), hh: hhOf(), grid: gridOf({ ...d, green: false }) });

  // 合計と内訳
  $('total').textContent = kg(fp.total);
  $('mKg').textContent = kg(fp.total);
  renderMbar(fp);
  // 土地の機会費用のあり・なしで合計がどれだけ変わるか
  const cocWas = S.coc; S.coc = !cocWas; const fpAlt = footprint(d); S.coc = cocWas;
  const withC = cocWas ? fp.total : fpAlt.total, withoutC = cocWas ? fpAlt.total : fp.total;
  $('cocLine').innerHTML = tpl(cocWas ? l.cocLineOn : l.cocLineOff, { w: kg(withC), wo: kg(withoutC), diff: kg(withC - withoutC), x: trim((withC / withoutC).toFixed(1)) });
  const cbDay = c.cb * 1000 / 365.25, avg = cbDay * FINAL.household;
  $('vs').textContent = tpl(l.vs, { where: cname(), avg: avg.toFixed(1) });
  $('stack').innerHTML = CATS.map(k => `<span style="width:${fp.total ? fp[k] / fp.total * 100 : 0}%;background:var(--c-${k})"></span>`).join('');
  $('legend').innerHTML = CATS.map(k => `<div><i style="background:var(--c-${k})"></i>${l.cat[k]}<span class="n num">${fp.total ? Math.round(fp[k] / fp.total * 100) : 0}%</span></div>`).join('');

  // 牛肉の影響
  const beefN = d.meals.filter(m => m === 'beef').length, beefKg = beefN * mealKg('beef'), beefSave = beefN * (mealKg('beef') - mealKg('chicken'));
  const bn = $('beefNote');
  bn.classList.toggle('on', beefN > 0);
  bn.innerHTML = beefN > 0
    ? tpl(l.beefNoteOn, { kg: kg(beefKg), p: Math.round(beefKg / fp.total * 100), save: kg(beefSave) })
      + tpl(S.coc ? l.beefCocOn : l.beefCocOff, { kg: kg(beefN * mealKg('beef', S.gwp, !S.coc)) })
    : tpl(l.beefNoteOff, { kg: kg(mealKg('beef') - mealKg('chicken')), x: trim((mealKg('beef') / mealKg('chicken')).toFixed(0)) });

  // 全体像：1人あたりの国全体（消費ベース）の中での位置
  const hh = avg, mine = Math.min(fp.total, hh), rest = Math.max(0, hh - fp.total), over = Math.max(0, fp.total - hh);
  const segs = [
    { k: 'mine', v: mine + over, c: 'var(--red)' },
    { k: 'rest', v: rest, c: '#8a6a4a' },
    { k: 'gov', v: cbDay * FINAL.government, c: '#5b6b7a' },
    { k: 'inv', v: cbDay * FINAL.investment, c: '#3d4752' },
  ];
  const wholeSum = segs.reduce((a, x) => a + x.v, 0);
  $('wholeH').innerHTML = tpl(l.wholeH, { where: cname(), t: kg(cbDay) });
  $('wholeBar').innerHTML = segs.filter(x => x.v > 0).map(x => `<span style="width:${x.v / wholeSum * 100}%;background:${x.c}"></span>`).join('')
    + `<i class="hh-mark" style="left:${hh / wholeSum * 100}%"></i>`;
  $('wholeLeg').innerHTML = segs.map(x => `<div><i style="background:${x.c}"></i>${x.k === 'mine' && beefN ? tpl(l.mineBeef, { kg: kg(beefKg) }) : l.whole[x.k]}<span class="num">${kg(x.v)} kg · ${Math.round(x.v / wholeSum * 100)}%</span></div>`).join('')
    + (over > 0 ? `<p class="over">${tpl(l.wholeOver, { kg: kg(over) })}</p>` : '');

  // 規模の切り替え
  $('scaleTabs').innerHTML = ['you', 'country', 'world'].map(s =>
    `<button data-scale="${s}" aria-pressed="${S.scale === s}">${tpl(l.scale[s], { name: c[S.lang] })}</button>`).join('');
  const perDayDeaths = pop => fp.total * pop * deathsPerKg();
  if (S.scale === 'you') {
    const days = fp.total > 0 ? 1 / (fp.total * deathsPerKg()) : Infinity;
    $('impBig').textContent = isFinite(days) ? tpl(l.youBig, { n: span(days) }) : '—';
    $('impCap').innerHTML = isFinite(days) ? tpl(l.youCap, { n: span(days) }) : '';
    $('impSub').innerHTML = tpl(l.youSub, { x: (fp.total * 365 * 80 * deathsPerKg()).toFixed(2) });
    $('mScale').textContent = l.scale.you; $('mImp').textContent = isFinite(days) ? tpl(l.youBig, { n: span(days) }) : '—';
  } else {
    const pop = S.scale === 'world' ? COUNTRIES.world.pop : c.pop;
    const name = S.scale === 'world' ? (S.lang === 'ja' ? '世界' : 'the world') : cname();
    const pd = perDayDeaths(pop), py = pd * 365, yrs = WW2 / py;
    $('impBig').textContent = people(pd);
    $('impCap').innerHTML = tpl(l.massCap, { name, pop: people(pop).replace(/ (lives|life)$/, '') });
    $('impSub').innerHTML = py > 0 ? tpl(l.massSub, { y: people(py),
      t: yrs >= 1 ? tpl(l.years, { n: yrs >= 10 ? fmt(yrs) : trim(yrs.toFixed(1)) }) : tpl(l.months, { n: Math.max(1, Math.round(yrs * 12)) }) }) : '';
    $('mScale').textContent = tpl(l.scale[S.scale], { name: c[S.lang] }); $('mImp').textContent = people(pd) + (S.lang === 'ja' ? '/日' : '/day');
  }

  // もし…
  $('wiLead').innerHTML = tpl(l.wiLead, { name: cname() });
  const avail = SWAPS.filter(s => s.ok(d));
  S.swaps.forEach(id => { if (!avail.some(s => s.id === id)) S.swaps.delete(id); });
  $('swaps').innerHTML = avail.map(s => {
    const alt = clone(d); s.apply(alt);
    const saved = fp.total - footprint(alt).total;
    return `<button class="swap" data-swap="${s.id}" aria-pressed="${S.swaps.has(s.id)}"><span class="box"></span><span>
      <b>${l.sw[s.id]}</b><span class="d">${tpl(l.swD, { kg: kg(saved), lives: people(livesPerYear(saved, c.pop)), name: cname() })}</span></span></button>`;
  }).join('');
  $('noSwaps').hidden = avail.length > 0;
  const imp = clone(d);
  SWAPS.forEach(s => { if (S.swaps.has(s.id) && s.ok(imp)) s.apply(imp); });
  const after = footprint(imp).total, saved = fp.total - after;
  $('impKg').textContent = kg(after) + ' kg';
  $('impPct').textContent = tpl(l.impPct, { kg: kg(saved), pct: fp.total ? Math.round(saved / fp.total * 100) : 0 });
  $('savedCK').textContent = tpl(l.savedCK, { name: cname() });
  const sc = livesPerYear(saved, c.pop), sw = livesPerYear(saved, COUNTRIES.world.pop);
  $('savedC').textContent = saved > 0 ? people(sc) : '—';
  $('savedCS').textContent = saved > 0 ? tpl(l.savedS, { x: trim((sc / WW2 * 100).toFixed(sc / WW2 < 0.1 ? 1 : 0)) }) : '';
  $('savedW').textContent = saved > 0 ? people(sw) : '—';
  $('savedWS').textContent = saved > 0 ? tpl(l.savedS, { x: fmt(sw / WW2 * 100) }) : '';

  renderPlate();

  // 説明
  $('aboutList').innerHTML = l.about.map(s => `<li>${tpl(s, { where: cname(), grid: c.grid })}</li>`).join('');
  const fr = l.fRows, rows = [
    ...Object.keys(F.transport).map(m => [l.mode[m], (m === 'ev' ? +(F.evKwhPerKm * c.grid).toFixed(3) : F.transport[m]) + ' kg ' + fr.perKm]),
    ...Object.keys(MEAL.portion).map(m => [l.meal[m], mealKg(m).toFixed(2) + ' kg ' + fr.perMeal + (S.gwp === 20 ? ' (GWP20)' : '') + (S.coc ? ' +COC' : '')]),
    [l.hvac.cool, F.hvacKwhPerH.cool + ' kWh ' + fr.perH], [l.hvac.heat, F.hvacKwhPerH.heat + ' kWh ' + fr.perH], [l.hvac.kero, F.keroKgPerH + ' kg ' + fr.perH],
    ...['shower', 'bath'].map(b => [l.bathLbl + ' — ' + l.bathOpt[b], waterHeat({ ...d, bath: b }).toFixed(1) + ' kWh ' + fr.perDay]),
    [l.powerOpt.green, F.greenGrid + ' kg / kWh'],
    ...Object.keys(F.applKwh).map(a => [l.appl + ' — ' + l.applOpt[a], F.applKwh[a] + ' kWh ' + fr.perDay]),
    [l.fShort, F.flight.short + ' kg ' + fr.perTrip], [l.fLong, F.flight.long + ' kg ' + fr.perTrip],
    ...Object.keys(F.shop).map(k => [l.shop[k], F.shop[k] + ' kg ' + fr.perItem]),
    ...['low', 'mid', 'high'].map(o => [l.otherLbl + ' — ' + l.otherOpt[o], otherFor(o).toFixed(2) + ' kg ' + fr.perDay]),
  ];
  $('factors').innerHTML = rows.map(([a, b]) => `<tr><td>${a}</td><td class="num">${b}</td></tr>`).join('');
}

function renderPlate() {
  const l = L(), d = S.day, c = C();
  $('gwpChips2').innerHTML = gwpChips();
  $('cocChips2').innerHTML = cocChips();
  $('cocMore').hidden = !S.coc;
  $('cocRateV').textContent = S.cocRate.toFixed(1) + l.cocUnit;
  // 今日の食事
  const st = [0, 0, 0, 0, 0];
  d.meals.forEach(m => mealStages(m).forEach((v, i) => { st[i] += v; }));
  const food = st.reduce((a, b) => a + b, 0), land = d.meals.reduce((a, m) => a + mealLand(m), 0);
  $('pFoodV').textContent = kg(food) + ' kg';
  $('pFoodS').textContent = tpl(l.pFoodS, { m: Math.round(st[1] / food * 100), d: Math.round(st[0] / food * 100) })
    + (S.coc ? tpl(l.pFoodSc, { c: Math.round(st[4] / food * 100) }) : '');
  $('pLandV').textContent = fmt(land) + ' m²';
  $('pLandS').textContent = tpl(l.pLandS, { n: S.lang === 'ja' ? fmt(land / 1.62) : trim((land / 12.5).toFixed(1)) });
  const km2 = land * 365 * c.pop / 1e6, x = km2 / c.area;
  $('pScaleK').textContent = tpl(l.pScaleK, { name: cname() });
  $('pScaleV').textContent = tpl(l.pScaleV, { x: x >= 10 ? fmt(x) : trim(x.toFixed(1)) });
  $('pScaleS').textContent = tpl(S.country === 'world' ? l.pScaleSW : l.pScaleS, { km: fmt(Math.round(km2 / 1000) * 1000), name: cname() });

  // 1食あたりの比較（目盛りは「GWP20＋機会費用」の最大値に固定し、切り替えで伸びが見えるようにする）
  const meals = Object.keys(MEAL.portion), max = Math.max(...meals.map(m => mealKg(m, 20, true)));
  $('mbars').innerHTML = meals.map(m => {
    const n = d.meals.filter(x => x === m).length, ms = mealStages(m);
    return `<div class="mrow${n ? ' today' : ''}"><div class="mn">${l.meal[m]}${n ? `<span class="badge">${tpl(l.todayBadge, { n })}</span>` : ''}</div>
      <div class="mb">${ms.map((v, i) => `<span class="${STAGES[i]}" style="width:${v / max * 100}%;background-color:var(--s-${STAGES[i]})" title="${l.stage[STAGES[i]]}: ${v.toFixed(2)} kg"></span>`).join('')}</div>
      <div class="mv num">${mealKg(m).toFixed(1)} kg</div></div>`;
  }).join('');
  $('slegend').innerHTML = STAGES.filter(s => s !== 'coc' || S.coc).map(s => `<span><i style="background:var(--s-${s})"></i>${l.stage[s]}</span>`).join('');

  // 解説：森林破壊（実際の排出）と土地の機会費用（森林に戻った場合との差）
  const bst = mealStages('beef', S.gwp, false);
  $('landExBody').innerHTML = tpl(l.exBody, { luc: bst[0].toFixed(1), tot: kg(bst.reduce((a, b) => a + b, 0)), coc: kg(mealLand('beef') * S.cocRate), rate: S.cocRate.toFixed(1) });

  // 牛肉1食を置き換えた場合
  $('swapT').innerHTML = `<tr>${l.swapCols.map((h, i) => `<th>${tpl(h, { name: cname() })}${S.coc && (i === 1 || i === 2) ? '<br>' + l.cocCol : ''}</th>`).join('')}</tr>` +
    [['vegan', l.toPlant], ['chicken', l.toChicken]].map(([to, label]) => {
      const d100 = mealKg('beef', 100) - mealKg(to, 100), d20 = mealKg('beef', 20) - mealKg(to, 20);
      const lives = livesPerYear(mealKg('beef', S.gwp, false) - mealKg(to, S.gwp, false), c.pop);
      const livesL = livesPerYear(mealKg('beef', S.gwp, true) - mealKg(to, S.gwp, true), c.pop);
      // 1食（主菜120 g）あたりの動物：牛 0.12/220 頭、鶏 0.12/1.3 羽 → 国全体・1年
      const yearMeals = c.pop * 365, cattle = 0.12 / 220 * yearMeals, chickens = 0.12 / 1.3 * yearMeals;
      const animals = to === 'vegan' ? tpl(l.cattle, { n: count(cattle) }) : `<span class="bad">${tpl(l.chickens, { n: count(chickens) })}</span>`;
      return `<tr class="${to === 'vegan' ? 'best' : 'meh'}"><td>${label}${to === 'vegan' ? ` <span class="best-tag">${l.best}</span>` : ''}</td>
        <td class="num">−${d100.toFixed(1)} kg</td><td class="num">−${d20.toFixed(1)} kg</td>
        <td class="num">−${fmt(mealLand('beef') - mealLand(to))} m²</td><td class="num">${animals}</td><td class="num g">${people(lives)}</td><td class="num g strong">${people(livesL)}</td></tr>`;
    }).join('');
  // 鶏肉と植物性の差（たんぱく質あたり、食材の比較データから）
  const perP = (f, ind) => FOODS[f][ind] / (FOODS[f].protein * 10);
  const rng = ind => { const r = PLANTS.map(pl => perP('chicken', ind) / perP(pl, ind)); return `${trim(Math.min(...r).toFixed(0))}〜${trim(Math.max(...r).toFixed(0))}`.replace('〜', S.lang === 'ja' ? '〜' : '–'); };
  const animalX = (FOODS.chicken.animals / FOODS.chicken.protein) / (FOODS.beef.animals / FOODS.beef.protein);
  $('swapCall').innerHTML = tpl(l.swapCall, { g: rng('ghg'), l: rng('land'), e: rng('eutro'), a: fmt(animalX) });
  $('swapNote').textContent = tpl(l.swapNote, { name: cname() });
}

// 下のバー：カテゴリの色帯（アイコンが凡例）、選んだときの増減、タップで内訳
var mPrev = null, mTimer = null;
const catShort = k => L().cat[k].replace(/[（(].*$/, '');
function renderMbar(fp) {
  const l = L(), tot = Math.max(fp.total, 0.001);
  $('mStack').innerHTML = CATS.map(k => { const w = Math.max(0, fp[k]) / tot * 100;
    return `<span data-k="${k}" style="width:${w}%;background:var(--c-${k})">${w > 9 ? l.mIcons[k] : ''}</span>`; }).join('');
  $('mPanel').innerHTML = CATS.map(k => `<div class="pr"><span>${l.mIcons[k]}</span><span><i class="bx" style="display:inline-block;background:var(--c-${k});margin-right:6px;vertical-align:-1px"></i>${catShort(k)}</span><span class="kv">${kg(fp[k])} kg</span><span class="pc">${Math.round(fp[k] / tot * 100)}%</span></div>`).join('')
    + `<div class="pr tot"><span></span><span>${l.mTotal}</span><span class="kv">${kg(fp.total)} kg</span><span class="pc">100%</span></div><div class="note">${l.mPanelNote}</div>`;
  // 直前の値と比べて、いちばん大きく変わったカテゴリを知らせる
  if (mPrev) {
    let best = null;
    CATS.forEach(k => { const dlt = fp[k] - mPrev[k]; if (Math.abs(dlt) >= 0.05 && (!best || Math.abs(dlt) > Math.abs(best.d))) best = { k, d: dlt }; });
    if (best) {
      const el = $('mDelta');
      el.textContent = `${l.mIcons[best.k]} ${best.d > 0 ? '+' : '−'}${kg(Math.abs(best.d))} kg  ${catShort(best.k)}`;
      el.className = 'mdelta show ' + (best.d > 0 ? 'up' : 'down');
      $('mStack').querySelector(`[data-k="${best.k}"]`)?.classList.add('flash');
      clearTimeout(mTimer); mTimer = setTimeout(() => { el.className = 'mdelta'; }, 2200);
    }
  }
  mPrev = { ...fp };
}
function toggleMpanel(force) {
  const p = $('mPanel'), open = force ?? p.hidden;
  p.hidden = !open; $('mbar').setAttribute('aria-expanded', String(open));
}
$('mbar').addEventListener('click', () => toggleMpanel());
document.addEventListener('click', e => { if (!e.target.closest('#mbar')) toggleMpanel(false); });
$('mbar').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleMpanel(); } });

/* ===================== EVENTS ===================== */
document.addEventListener('click', e => {
  const link = e.target.closest('.coc-link');
  if (link) { e.preventDefault(); const a = $('landExplain'); a.open = true; $('plateAdv').open = true; a.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  const t = e.target.closest('button, .item');
  if (!t) return;
  const d = S.day;
  if (t.dataset.lang) { S.lang = t.dataset.lang; store.set('scw-lang', S.lang); renderStatic(); return; }
  if (t.dataset.scale) { S.scale = t.dataset.scale; update(); return; }
  if (t.dataset.swap) { S.swaps.has(t.dataset.swap) ? S.swaps.delete(t.dataset.swap) : S.swaps.add(t.dataset.swap); update(); return; }
  if (t.dataset.step) { const k = t.dataset.step; d[k] = Math.min(20, Math.max(0, d[k] + +t.dataset.d)); $('n-' + k).textContent = d[k]; update(); return; }
  if (t.dataset.minus) { e.stopPropagation(); d.shop[t.dataset.minus] = Math.max(0, d.shop[t.dataset.minus] - 1); rebuild(); return; }
  if (t.dataset.shop) { d.shop[t.dataset.shop] = Math.min(20, d.shop[t.dataset.shop] + 1); rebuild(); return; }
  if (t.dataset.own) { d.own[t.dataset.own] = !d.own[t.dataset.own]; rebuild(); return; }
  if (t.dataset.g) {
    const g = t.dataset.g, v = t.dataset.v;
    if (g === 'gwp') { S.gwp = +v; rebuild(); return; }
    if (g === 'coc') { S.coc = v === '1'; rebuild(); return; }
    if (g === 'mode') d.mode = v;
    else if (g === 'hvac') { d.hvac = v; $('hvacMore').hidden = v === 'off'; }
    else if (g === 'appl') d.appl = v;
    else if (g === 'heater') d.heater = v;
    else if (g === 'power') d.green = v === 'green';
    else if (g === 'other') d.other = v;
    else if (g.startsWith('meal')) d.meals[+g.slice(4)] = v;
    t.parentElement.querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', String(b === t)));
    update();
  }
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList?.contains('item')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'km') S.day.km = +e.target.value;
  else if (e.target.id === 'hours') S.day.hours = +e.target.value;
  else if (e.target.id === 'eco') S.day.eco = e.target.checked;
  else if (e.target.id === 'cocRate') S.cocRate = +e.target.value;
  else return;
  update();
});
document.addEventListener('change', e => { if (e.target.id === 'goodsRef') { S.ref = e.target.value; rebuild(); } });
$('country').addEventListener('change', e => {
  S.country = e.target.value;
  S.day.bath = S.country === 'japan' ? 'bath' : 'shower';   // 給湯の前提：日本は毎日湯船、ほかはシャワー（選択肢は出さない）
  mPrev = null;   // 地域の切り替えでも増減は知らせない（前提が丸ごと変わるため）
  rebuild();
});
$('tip').addEventListener('change', e => { S.tip = +e.target.value; update(); });
if (location.hash === '#landExplain') { $('plateAdv').open = true; $('landExplain').open = true; setTimeout(() => $('landExplain').scrollIntoView({ block: 'start' }), 50); }

renderStatic();
</script>
</body>
</html>
