<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --text: #1d1d1f; --muted: #6b6b70;
    --line: #dcdad4; --accent: #b3261e; --war: #5b6b7a; --grid: #ecebe6; --tip: #b7791f;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151517; --panel: #1f1f22; --text: #ececee; --muted: #9a9aa2;
      --line: #34343a; --accent: #ff6b5e; --war: #9fb0c0; --grid: #2a2a2f; --tip: #e0a43b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: 13px; }
  .lang { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex: none; }
  .lang button { font: inherit; font-size: 12px; background: transparent; color: var(--muted); border: 0; padding: 5px 12px; cursor: pointer; }
  .lang button[aria-pressed="true"] { background: var(--text); color: var(--bg); font-weight: 700; }
  .grid { display: grid; gap: 16px; grid-template-columns: 1fr; }
  @media (min-width: 760px) { .grid { grid-template-columns: 300px 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  .panel h2 { font-size: 13px; letter-spacing: .04em; color: var(--muted); margin: 0 0 12px; font-weight: 600; }
  label { display: block; font-size: 13px; margin: 14px 0 4px; }
  .first { margin-top: 0; }
  .row { display: flex; align-items: center; gap: 8px; }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  select { width: 100%; font: inherit; font-size: 13px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--panel); color: var(--text); }
  .val { min-width: 76px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .hint { color: var(--muted); font-size: 11.5px; margin-top: 2px; }
  .counter { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--accent);
    font-size: clamp(30px, 7vw, 48px); line-height: 1.1; letter-spacing: .01em; }
  .stat .k { font-size: 13px; color: var(--muted); }
  .stat .v { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat .x { font-size: 12.5px; color: var(--muted); }
  .stat .lin { font-size: 12px; color: var(--muted); }
  .stat .rng { color: var(--tip); }
  .ref { padding-top: 12px; margin-top: 12px; border-top: 1px solid var(--line); }
  .two { display: grid; gap: 12px 24px; grid-template-columns: 1fr; }
  @media (min-width: 560px) { .two { grid-template-columns: 1fr 1fr; } }
  canvas { width: 100%; height: 280px; display: block; }
  .legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); margin-top: 6px; flex-wrap: wrap; }
  .sw { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 6px; }
  .note { font-size: 12px; color: var(--muted); margin-top: 20px; }
  .note a { color: var(--text); }
  button.reset { font: inherit; font-size: 12px; border: 1px solid var(--line); background: transparent;
    color: var(--text); border-radius: 6px; padding: 4px 10px; cursor: pointer; margin-top: 16px; }
  [hidden] { display: none !important; }
  .sim-footer { text-align: center; color: var(--muted); font-size: 12px; padding: 8px 16px 40px; }
  .sim-footer a { color: var(--muted); }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Deterministic Climate Casualty Counter</h1>
      <p class="sub" data-i18n="sub"></p>
    </div>
    <div class="lang" role="group" aria-label="Language"><button data-lang="en">EN</button><button data-lang="ja">日本語</button></div>
  </header>

  <div class="grid">
    <section class="panel">
      <h2 data-i18n="params"></h2>

      <label for="country" class="first" data-i18n="country"></label>
      <select id="country"></select>
      <div class="hint" data-i18n="countryHint"></div>

      <label for="emis" data-i18n="emis"></label>
      <div class="row"><input id="emis" type="range" min="0.1" max="60" step="0.1" value="42"><span class="val" id="emisV"></span></div>
      <div class="hint" id="emisHint"></div>

      <label for="tpd" data-i18n="tpd"></label>
      <div class="row"><input id="tpd" type="range" min="500" max="10000" step="4" value="3664"><span class="val" id="tpdV"></span></div>
      <div class="hint" data-i18n="tpdHint"></div>

      <label for="unc" data-i18n="unc"></label>
      <select id="unc"></select>
      <div class="hint" data-i18n="uncHint"></div>

      <label for="tip" data-i18n="tip"></label>
      <select id="tip"></select>
      <div class="hint" data-i18n="tipHint"></div>

      <label for="rate" data-i18n="rate"></label>
      <div class="row"><input id="rate" type="range" min="-10" max="3" step="0.5" value="0"><span class="val" id="rateV"></span></div>
      <div class="hint" data-i18n="rateHint"></div>

      <label for="start" data-i18n="start"></label>
      <div class="row"><input id="start" type="range" min="2020" max="2030" step="1" value="2025"><span class="val" id="startV"></span></div>

      <label for="end" data-i18n="end"></label>
      <div class="row"><input id="end" type="range" min="2030" max="2100" step="1" value="2050"><span class="val" id="endV"></span></div>

      <button class="reset" id="reset" data-i18n="reset"></button>
    </section>

    <div class="grid" style="grid-template-columns:1fr">
      <section class="panel">
        <h2 id="todayH"></h2>
        <div class="counter" id="today">0</div>
        <div class="hint" id="rateLine"></div>
        <div class="hint" id="sessionLine" style="margin-top:6px"></div>
      </section>

      <section class="panel">
        <h2 data-i18n="cmpH"></h2>
        <div class="two">
          <div class="stat"><div class="k" id="k10"></div><div class="v" id="v10"></div><div class="x" id="x10"></div><div class="lin" id="l10"></div><div class="lin rng" id="r10"></div></div>
          <div class="stat"><div class="k" id="kEnd"></div><div class="v" id="vEnd"></div><div class="x" id="xEnd"></div><div class="lin" id="lEnd"></div><div class="lin rng" id="rEnd"></div></div>
        </div>
        <div class="stat ref">
          <div class="k" data-i18n="warRef"></div>
          <div class="x" data-i18n="warRefD"></div>
        </div>
      </section>

      <section class="panel">
        <h2 data-i18n="chartH"></h2>
        <canvas id="chart"></canvas>
        <div class="legend">
          <span><span class="sw" style="background:var(--accent)"></span><span data-i18n="lgCum"></span></span>
          <span id="lgTipWrap"><span class="sw" style="background:var(--tip)"></span><span data-i18n="lgLin"></span></span>
          <span><span class="sw" style="background:var(--war)"></span><span data-i18n="lgWar"></span></span>
        </div>
      </section>
    </div>
  </div>

  <p class="note" data-i18n="note"></p>
  <div id="next" style="margin-top:28px"></div>
  <section class="panel" style="margin-top:16px">
    <h2 data-i18n="srcH"></h2>
    <div id="sources"></div>
    <p class="note"><a href="sources.html" data-i18n="srcAll"></a></p>
  </section>
  <div id="author" style="margin-top:28px"></div>
</main>
<footer class="sim-footer" data-i18n="footer"></footer>

<script src="site.js?v=20261020g"></script>
<script>
// 化石燃料CO₂（2023年頃の概算, Global Carbon Project）。世界合計は土地利用変化を含む 40 Gt。
const COUNTRIES = {
  world:  { en: 'World',          ja: '世界全体', gt: 42 },
  china:  { en: 'China',          ja: '中国',     gt: 12.3 },
  us:     { en: 'United States',  ja: '米国',     gt: 4.9 },
  india:  { en: 'India',          ja: 'インド',   gt: 3.2 },
  eu:     { en: 'European Union', ja: 'EU',       gt: 2.4 },
  russia: { en: 'Russia',         ja: 'ロシア',   gt: 1.8 },
  japan:  { en: 'Japan',          ja: '日本',     gt: 0.96 },
  uk:     { en: 'United Kingdom', ja: '英国',     gt: 0.31 },
  custom: { en: 'Custom',         ja: 'カスタム', gt: null },
};
// 線形推計に掛ける概算の係数（例示であり査読済みの推計ではない）
const TIPS = [
  { m: 1,   en: 'None (1,000-ton rule only)',        ja: 'なし（1,000トン・ルールのみ）' },
  { m: 1.5, en: 'Moderate feedbacks ×1.5',           ja: '中程度のフィードバック ×1.5' },
  { m: 2,   en: 'Tipping-point cascade ×2',          ja: 'ティッピング連鎖 ×2' },
  { m: 3,   en: 'Cascade + societal collapse ×3',    ja: '連鎖＋社会的崩壊 ×3' },
];
const WW2 = 80e6, WW1 = 20e6;

const I18N = {
  en: {
    title: 'Climate Casualty Simulator',
    sub: 'Future deaths “locked in” by CO₂ emissions — based on the 1,000-ton rule (≈ 1 future death per 1,000 t of carbon burned ≈ 3,664 t of CO₂)',
    params: 'PARAMETERS', country: 'Country / region', countryHint: 'Sets the emissions below (fossil CO₂ in 2024, Global Carbon Budget 2025)',
    emis: 'Annual CO₂ emissions (base year)', emisHint: '{name}: ≈ {gt} Gt / year',
    unc: 'Uncertainty of the 1,000-ton rule', uncHint: 'An order-of-magnitude estimate: try the low (×0.1) and high (×10) ends of the authors’ range. Comparisons between choices do not depend on this.',
    range: 'Range (0.1–10× the central value): {lo} – {hi}',
    tpd: 'CO₂ per one future death', tpdHint: '1,000-ton rule = 1,000 t of carbon ≈ 3,664 t CO₂ per person (likely range: 10× either way)',
    tip: 'Tipping effects (rough multiplier)', tipHint: 'Illustrative, not peer-reviewed: permafrost, forest dieback, conflict, famine, migration…',
    rate: 'Annual change in emissions', rateHint: '0% = flat / −3% = gradual cuts / −7% ≈ 2 °C pathway',
    start: 'Base year', end: 'Count until', reset: 'Reset',
    todayH: 'FUTURE DEATHS LOCKED IN TODAY — {name} (since midnight, your local time)',
    rateLine: 'Current pace: {d} per day / {s} per second', session: 'Since you opened this page: {n}',
    cmpH: 'CUMULATIVE DEATHS VS. PAST WARS',
    k10: 'Locked in over 10 years to {y}', kEnd: 'Cumulative to {y}',
    ratio: '≈ {a}× WWII / ≈ {b}× WWI', linear: 'Linear (no tipping): {n}',
    warRef: 'Reference: deaths in past wars', warRefD: 'World War II ≈ 70–85 million (median 80 million) / World War I ≈ 20 million',
    chartH: 'CUMULATIVE DEATHS OVER TIME', lgCum: 'Cumulative locked-in deaths', lgLin: 'Linear (no tipping)', lgWar: 'Multiples of WWII (80M)',
    footer: '<a href="index.html">The Slow War</a> · <a href="sources.html">Sources &amp; data</a>',
    srcH: 'Sources & further reading', srcAll: 'All sources and key assumptions →',
    note: '* Deaths = cumulative emissions ÷ CO₂ per death × tipping multiplier. With tipping effects set to “None” this is a conservative linear lower bound. Tipping multipliers are rough illustrative assumptions. For the general audience version, see the <a href="index.html">story page</a>; for your own day, the <a href="my-day.html">personal simulator</a>.',
  },
  ja: {
    title: '気候犠牲者シミュレータ',
    sub: '気候崩壊による「確定した未来の犠牲者」シミュレータ — 1,000トン・ルール（炭素1,000 t ≒ CO₂ 3,664 t の排出で将来の死者 1 人）に基づく推計',
    params: 'パラメータ', country: '国・地域', countryHint: '選ぶと下の排出量が設定されます（2024年の化石燃料由来CO₂、Global Carbon Budget 2025）',
    emis: '年間CO₂排出量（基準年）', emisHint: '{name}：約 {gt} Gt/年',
    unc: '1,000トン・ルールの不確かさ', uncHint: '桁の目安となる推計です。著者が示す幅の下限（×0.1）と上限（×10）を試せます。選択どうしの比べ方は、この設定によりません。',
    range: '幅（中央値の0.1〜10倍）：{lo} 〜 {hi}',
    tpd: '1人の死を生む排出量（CO₂）', tpdHint: '1,000トン・ルール ＝ 炭素1,000 t ≒ CO₂ 3,664 t/人（幅は上下に約10倍）',
    tip: 'ティッピング効果（概算の係数）', tipHint: '査読済みの推計ではない目安：永久凍土・森林枯死・紛争・飢饉・移民など',
    rate: '排出量の年変化率', rateHint: '0% ＝ 現状維持 / −3% ＝ ゆるやかな削減 / −7% ≒ 2℃経路',
    start: '基準年', end: '集計終了年', reset: '初期値に戻す',
    todayH: '本日確定した未来の犠牲者 — {name}（あなたの地域の今日0時から）',
    rateLine: '現在のペース：1日 {d} 人 ／ 1秒 {s} 人', session: 'このページを開いてから：{n} 人',
    cmpH: '累積確定犠牲者と過去の戦争の比較',
    k10: '{y}年までの10年間で確定', kEnd: '{y}年までの累積確定',
    ratio: '第二次世界大戦の約 {a} 倍 / 第一次世界大戦の約 {b} 倍', linear: '線形（ティッピングなし）：{n}',
    warRef: '参考：過去の戦争による死者数', warRefD: '第二次世界大戦 ≒ 7,000万〜8,500万人（中央値 8,000万） / 第一次世界大戦 ≒ 2,000万人',
    chartH: '累積犠牲者の推移', lgCum: '累積確定犠牲者', lgLin: '線形（ティッピングなし）', lgWar: 'WWII（8,000万）の倍数',
    footer: '<a href="index.html">静かな戦争</a> ・ <a href="sources.html">出典とデータ</a>',
    srcH: '出典と参考資料', srcAll: 'すべての出典と主な前提 →',
    note: '※ 死者数 ＝ 累積排出量 ÷ 1人あたり排出量 × ティッピング係数。ティッピング効果「なし」のときは控えめな線形の下限推計です。ティッピング係数は目安として示した概算です。一般向けの解説は <a href="index.html">ストーリーページ</a>、自分の1日に置き換えるなら <a href="my-day.html">個人シミュレータ</a> をどうぞ。',
  },
};

const $ = id => document.getElementById(id);
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
let lang = store.get('scw-lang') === 'ja' ? 'ja' : 'en';
const t = (k, v = {}) => I18N[lang][k].replace(/\{(\w+)\}/g, (_, x) => v[x] ?? '');
const sliders = ['emis', 'tpd', 'rate', 'start', 'end'];
const defaults = { ...Object.fromEntries(sliders.map(i => [i, $(i).value])), country: 'world', tip: '1' };
const fmt = n => Math.round(n).toLocaleString('en-US');
// 桁の目安の推計なので、小さな数は有効数字2桁に丸めて見せる
const sig = (n, d = 2) => { if (n <= 0) return 0; const p = Math.pow(10, Math.floor(Math.log10(n)) - d + 1); return Math.round(n / p) * p; };

const trim = s => s.replace(/\.0$/, '');
const short = n => lang === 'ja'
  ? (n >= 1e8 ? trim((n / 1e8).toFixed(n >= 1e10 ? 0 : 1)) + '億人' : n >= 1e4 ? Math.round(n / 1e4).toLocaleString() + '万人' : fmt(n) + '人')
  : (n >= 1e9 ? trim((n / 1e9).toFixed(1)) + ' billion' : n >= 1e6 ? trim((n / 1e6).toFixed(n >= 1e7 ? 0 : 1)) + ' million' : fmt(n));
const ratioTxt = x => x >= 10 ? Math.round(x) : trim(x.toFixed(1));

// 1,000トン・ルールの不確かさ：著者は炭素1,000 tあたり0.1〜10人の幅を示している
const UNC = [
  { f: 0.1, en: 'Low end (×0.1)', ja: '控えめな端（×0.1）' },
  { f: 1,   en: 'Central estimate', ja: '中央値' },
  { f: 10,  en: 'High end (×10)', ja: '高めの端（×10）' },
];
function params() {
  return { E0: +$('emis').value, tpd: +$('tpd').value, r: +$('rate').value / 100,
           start: +$('start').value, end: +$('end').value, m: TIPS[+$('tip').value].m, u: UNC[+$('unc').value].f };
}
// 年ごとの累積犠牲者（線形 lin と ティッピング込み cum）
function series(p) {
  const out = [{ year: p.start, lin: 0, cum: 0 }];
  let lin = 0;
  for (let y = p.start; y < Math.max(p.end, p.start + 10); y++) {
    lin += p.E0 * Math.pow(1 + p.r, y - p.start) * 1e9 / p.tpd * p.u;
    out.push({ year: y + 1, lin, cum: lin * p.m });
  }
  return out;
}
const at = (s, year) => s.find(d => d.year === year) || s[s.length - 1];
function deathsPerSec(p) {
  const yrs = Math.max(0, new Date().getFullYear() - p.start);
  return p.E0 * Math.pow(1 + p.r, yrs) * 1e9 / p.tpd * p.m * p.u / (365.25 * 86400);
}
const countryName = () => COUNTRIES[$('country').value][lang];

function applyLang() {
  document.documentElement.lang = lang;
  document.title = t('title');
  document.querySelectorAll('[data-i18n]').forEach(el => { el.innerHTML = t(el.dataset.i18n); });
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  const c = $('country').value || 'world', tp = $('tip').value || '1', un = $('unc').value || '1';
  $('country').innerHTML = Object.entries(COUNTRIES).map(([k, v]) => `<option value="${k}"${k === 'custom' ? ' disabled' : ''}>${v[lang]}</option>`).join('');
  $('tip').innerHTML = TIPS.map((x, i) => `<option value="${i}">${x[lang]}</option>`).join('');
  $('unc').innerHTML = UNC.map((x, i) => `<option value="${i}">${x[lang]}</option>`).join('');
  $('country').value = c; $('tip').value = tp; $('unc').value = un;
  if (typeof swNav === 'function') { swNav(lang); swNext($('next'), lang); swAuthor($('author'), lang); }
  if (typeof swRenderSources === 'function') swRenderSources($('sources'), lang, ['core', 'emissions', 'pathways', 'tipping', 'war'], 4);
  update();
}

function update() {
  const p = params();
  if (p.end <= p.start) { $('end').value = p.start + 1; p.end = p.start + 1; }
  $('emisV').textContent = trim(p.E0.toFixed(1)) + ' Gt';
  $('tpdV').textContent = fmt(p.tpd) + ' t';
  $('rateV').textContent = (p.r > 0 ? '+' : '') + (p.r * 100).toFixed(1) + '%';
  $('startV').textContent = p.start;
  $('endV').textContent = p.end;
  const cKey = $('country').value;
  $('emisHint').textContent = cKey === 'custom' ? '' : t('emisHint', { name: countryName(), gt: COUNTRIES[cKey].gt });

  const s = series(p), y10 = p.start + 10, a10 = at(s, y10), aEnd = at(s, p.end);
  const showLin = p.m !== 1;
  $('k10').textContent = t('k10', { y: y10 });
  $('v10').textContent = fmt(a10.cum);
  $('x10').textContent = short(a10.cum) + '　' + t('ratio', { a: ratioTxt(a10.cum / WW2), b: ratioTxt(a10.cum / WW1) });
  $('l10').textContent = showLin ? t('linear', { n: short(a10.lin) }) : '';
  $('kEnd').textContent = t('kEnd', { y: p.end });
  $('vEnd').textContent = fmt(aEnd.cum);
  $('xEnd').textContent = short(aEnd.cum) + '　' + t('ratio', { a: ratioTxt(aEnd.cum / WW2), b: ratioTxt(aEnd.cum / WW1) });
  $('lEnd').textContent = showLin ? t('linear', { n: short(aEnd.lin) }) : '';
  // 幅：中央値の0.1〜10倍
  $('r10').textContent = t('range', { lo: short(a10.cum / p.u * 0.1), hi: short(a10.cum / p.u * 10) });
  $('rEnd').textContent = t('range', { lo: short(aEnd.cum / p.u * 0.1), hi: short(aEnd.cum / p.u * 10) });
  $('lgTipWrap').hidden = !showLin;

  const dps = deathsPerSec(p);
  $('todayH').textContent = t('todayH', { name: countryName() });
  $('rateLine').textContent = t('rateLine', { d: '≈' + fmt(sig(dps * 86400)), s: dps < 0.1 ? dps.toFixed(3) : dps.toFixed(1) });
  draw(s.filter(d => d.year <= p.end), showLin);
}

const sessionStart = performance.now();
function tick() {
  const dps = deathsPerSec(params());
  const now = new Date(), midnight = new Date(now); midnight.setHours(0, 0, 0, 0);
  $('today').textContent = fmt((now - midnight) / 1000 * dps);
  $('sessionLine').textContent = t('session', { n: fmt((performance.now() - sessionStart) / 1000 * dps) });
  requestAnimationFrame(tick);
}

function axisLabel(v) {
  if (v === 0) return '0';
  if (lang === 'ja') return v >= 1e8 ? trim((v / 1e8).toFixed(1)) + '億' : (v / 1e4).toLocaleString() + '万';
  return v >= 1e9 ? trim((v / 1e9).toFixed(1)) + 'B' : trim((v / 1e6).toFixed(0)) + 'M';
}
function draw(s, showLin) {
  const cv = $('chart'), dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
  const css = getComputedStyle(document.documentElement);
  const c = k => css.getPropertyValue(k).trim();
  const m = { l: 56, r: 20, t: 12, b: 28 };
  const maxY = Math.max(WW2, s[s.length - 1].cum) * 1.08;
  const x0 = s[0].year, x1 = s[s.length - 1].year;
  const X = y => m.l + (y - x0) / (x1 - x0) * (W - m.l - m.r);
  const Y = v => H - m.b - v / maxY * (H - m.t - m.b);

  ctx.font = '11px -apple-system, sans-serif';
  ctx.fillStyle = c('--muted'); ctx.strokeStyle = c('--grid'); ctx.lineWidth = 1;
  const step = niceStep(maxY / 5);
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (let v = 0; v <= maxY; v += step) {
    ctx.beginPath(); ctx.moveTo(m.l, Y(v)); ctx.lineTo(W - m.r, Y(v)); ctx.stroke();
    ctx.fillText(axisLabel(v), m.l - 6, Y(v));
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  const ys = Math.ceil((x1 - x0) / 6 / 5) * 5 || 1;
  for (let y = Math.ceil(x0 / ys) * ys; y <= x1; y += ys) ctx.fillText(y, X(y), H - m.b + 6);

  // WWII 倍数ライン
  ctx.strokeStyle = c('--war'); ctx.fillStyle = c('--war'); ctx.setLineDash([4, 4]);
  ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
  const shown = [1, 2, 5, 10, 20, 50, 100].filter(k => k * WW2 <= maxY);
  shown.filter((k, i) => shown.length <= 4 || i === 0 || i >= shown.length - 3).forEach(k => {
    ctx.beginPath(); ctx.moveTo(m.l, Y(k * WW2)); ctx.lineTo(W - m.r, Y(k * WW2)); ctx.stroke();
    ctx.fillText(`WWII ×${k}`, m.l + 4, Y(k * WW2) - 2);
  });

  const line = (key, color, dash) => {
    ctx.setLineDash(dash); ctx.strokeStyle = color; ctx.lineWidth = 2.5; ctx.beginPath();
    s.forEach((d, i) => i ? ctx.lineTo(X(d.year), Y(d[key])) : ctx.moveTo(X(d.year), Y(d[key])));
    ctx.stroke();
  };
  if (showLin) line('lin', c('--tip'), [6, 4]);
  line('cum', c('--accent'), []);
  ctx.setLineDash([]);
}
function niceStep(raw) {
  const p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p;
}

sliders.forEach(i => $(i).addEventListener('input', () => {
  if (i === 'emis') $('country').value = 'custom';
  update();
}));
$('country').addEventListener('change', e => { $('emis').value = COUNTRIES[e.target.value].gt; update(); });
$('tip').addEventListener('change', update);
$('unc').addEventListener('change', update);
document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => {
  lang = b.dataset.lang; store.set('scw-lang', lang); applyLang();
}));
$('reset').addEventListener('click', () => {
  sliders.forEach(i => $(i).value = defaults[i]);
  $('country').value = defaults.country; $('tip').value = defaults.tip; $('unc').value = '1'; update();
});
window.addEventListener('resize', update);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', update);
applyLang(); tick();
</script>
</body>
